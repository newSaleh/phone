<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#1e3a5f;--line:#e2e8f2;--dn:#b91c1c;--warn:#92400e;--warnbg:#fef3c7}
:root[data-theme=dark]{--bg:#10151d;--card:#18202c;--ink:#e5e9f0;--mut:#9aa6b8;--pri:#7fb0ff;--line:#2a3547;--dn:#f08585;--warn:#fcd34d;--warnbg:#3a2f12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:1.2rem;margin:0;color:var(--pri)}
.theme{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}

input,select{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;margin-bottom:10px}.row>div{flex:1;min-width:0}
.go{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--bg);font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;margin-bottom:12px}
.rng{color:var(--mut);font-size:.82rem;margin:-4px 0 10px;line-height:1.6}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.88rem;margin-bottom:10px;line-height:1.6}
.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
pre{white-space:pre-wrap;word-wrap:break-word;margin:0;font:inherit;font-size:1rem;line-height:1.75}
.out,.out *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.err{color:var(--dn);text-align:center;padding:12px;font-size:.92rem}
[hidden]{display:none!important}

  let per = a === b ? 'يوم ' + dm(a) : 'من ' + dm(a) + ' إلى ' + dm(b); const one = $('sp').value, L = [];

  fillCats(one); const cat = D.cat && one !== '' && $('ct').value !== '' ? +$('ct').value : null, cn = cat === null ? '' : D.cat.names[cat];
  if(one === '' && D.lite){ $('out').hidden = true; $('err').textContent = 'اختر المورد من القائمة أو ابحث باسمه أو رقمه'; return; }
  if(one === ''){  // كل الموردين + الإجمالي
    L.push('مبيعات الموردين (' + br + ')', per, '_________________________');
    if(br === D.branches[0]){  // إجمالي كل فرع أعلى الصفحة مثل رسالة اليومية (طلب 2026-11-15)
      const bt = {}; D.branches.slice(1).forEach(x => bt[x] = 0);
      for(let d = a; d <= b; d = addDays(d, 1)) D.branches.slice(1).forEach(x => { const r = D.days[d] && D.days[d][x]; if(r) r.forEach(([, v]) => bt[x] += v); });
      D.branches.slice(1).sort((x, y) => bt[y] - bt[x]).forEach(x => L.push(x + ': ' + fmt(bt[x])));  // من الأكثر للأقل (2026-11-15)
      L.push('', 'الإجمالي: ' + fmt(rows.reduce((t, [, v]) => t + v, 0)), '_________________________');
    } else L.push(br + ': ' + fmt(rows.reduce((t, [, v]) => t + v, 0)), '_________________________');  // فرع واحد: مجموع مبيعاته أعلى الصفحة (2026-11-15)
    L.push('عدد الموردين ' + rows.length, '_________________________');
    rows.forEach(([i, v], k) => L.push((k + 1) + '. ' + D.sups[i] + ' — ' + fmt(v)));
    L.push('', 'الإجمالي: ' + fmt(rows.reduce((t, [, v]) => t + v, 0)));
  } else {  // مورد واحد: مجموعه في الفترة وترتيبه، ومع «كل الفروع» توزيعه على الفروع
    const k = rows.findIndex(([i]) => i === one);

    else if(cat !== null){  // صنف واحد
      const brs = br === D.branches[0] ? D.branches.slice(1) : [br], cs = catSales(a, b, +one, cat, brs), ct = brs.reduce((t, x) => t + cs.pb[x], 0);
      L.push('مبيعات الصنف: ' + fmt(ct), 'من مبيعات المورد ' + fmt(rows[k][1]) + (rows[k][1] > 0 ? ' (' + Math.round(ct * 100 / rows[k][1]) + '%)' : ''));
      if(brs.length > 1){ L.push('', 'حسب الفرع:'); brs.filter(x => Math.round(cs.pb[x])).sort((x, y) => cs.pb[y] - cs.pb[x]).forEach(x => L.push(x + ' — ' + fmt(cs.pb[x]))); }
      L.push('(مبيعات المورد في اليومية موزعة على أصنافه بنسبة حركة البيع)');

    }
    else {
      L.push('المبيعات: ' + fmt(rows[k][1]), 'ترتيبه: ' + (k + 1) + ' من ' + rows.length + ' موردًا');
      if(br === D.branches[0]){
        const pb = {}; D.branches.slice(1).forEach(x => pb[x] = 0);
        for(let d = a; d <= b; d = addDays(d, 1)) D.branches.slice(1).forEach(x => { const r = D.days[d] && D.days[d][x]; if(r) r.forEach(([i, v]) => { if(i === +one) pb[x] += v; }); });
        L.push('', 'حسب الفرع:'); Object.entries(pb).filter(([, v]) => v !== 0).sort((x, y) => y[1] - x[1]).forEach(([x, v]) => L.push(x + ' — ' + fmt(v)));
      }
    }
    if(D.dl){  // مبلغ التنزيل = التنزيل − المرتجع للمستودع، لنفس الفترة، الفروع من الأكثر للأقل (طلب 2026-11-20)
      const LV = D.dl._live || {}, pb = {}, brs = br === D.branches[0] ? D.branches.slice(1) : [br], dd = Object.keys(D.dl).filter(x => x[0] !== '_').sort(); let have = 0, dmiss = 0, inToday = false;
      brs.forEach(x => pb[x] = 0);
      for(let d = a; d <= b; d = addDays(d, 1)){ const day = D.dl[d]; if(!day){ dmiss++; continue; } have++; if(D.live && d === D.live.date) inToday = true;
        brs.forEach(x => { const r = day[x]; if(r) r.forEach(([i, v, cs]) => { if(i !== +one) return; if(cat === null) pb[x] += v; else if(cs) cs.forEach(([c, w]) => { if(c === cat) pb[x] += w; }); }); }); }
      L.push('', '_________________________', 'مبلغ التنزيل (التنزيل − المرتجع) بسعر البيع' + (cat !== null ? ' — صنف: ' + cn : '') + ':');
      if(!have) L.push('لا توجد بيانات تنزيل لهذه الفترة' + (dd.length ? ' (المتاح من ' + dm(dd[0]) + ' إلى ' + dm(dd[dd.length - 1]) + ')' : ''));
      else {
        brs.slice().sort((x, y) => pb[y] - pb[x]).forEach(x => L.push(x + ' — ' + fmt(pb[x])));
        if(brs.length > 1) L.push('المجموع: ' + fmt(brs.reduce((t, x) => t + pb[x], 0)));
        if(dmiss) L.push('(محسوب حتى ' + dm(dd[dd.length - 1]) + ')');
        if(inToday){  // اليوم: حتى آخر «تحديث» لمتابعة التنزيل في كل فرع
          const on = brs.filter(x => LV[x]), off = brs.filter(x => !LV[x]);
          if(on.length) L.push('(اليوم حتى آخر تحديث لمتابعة التنزيل: ' + on.map(x => (brs.length > 1 ? x + ' ' : '') + clock(LV[x])).join('، ') + ')');
          if(off.length) L.push('(' + (brs.length > 1 ? off.join('، ') + ': ' : '') + 'لم تُحدَّث متابعة التنزيل اليوم بعد، فلا يُحسب تنزيل اليوم)');
        }
      }
    }
    if(D.stock && D.stock.locs){  // المخزون الحالي للمورد (آخر لقطة، بسعر البيع)
      const sv = D.stock.v[one], hd = 'المخزون الحالي بسعر البيع (نهاية ' + dm(D.stock.date) + ')';
      L.push('', '_________________________', hd + ':');
      if(cat !== null && sv) L.push('(مخزون المورد بكل أصنافه — المخزون حسب الصنف غير متاح)');
      if(!sv) L.push('لا يوجد مخزون مسجل لهذا المورد');
      else if(br === D.branches[0]){
        D.stock.locs.map((x, j) => [x, sv[j]]).filter(([, v]) => v).sort((p, q) => q[1] - p[1]).forEach(([x, v]) => L.push(x + ' — ' + fmt(v)));  // تنازليًا (2026-11-15)
        L.push('مجموع مخزون المورد: ' + fmt(sv.reduce((t, x) => t + x, 0)));
      } else { const j = D.stock.locs.indexOf(br); L.push(br + ' — ' + fmt(j >= 0 ? sv[j] : 0)); }
    }
  }
  $('txt').textContent = L.join('\n'); $('out').hidden = false;
}
