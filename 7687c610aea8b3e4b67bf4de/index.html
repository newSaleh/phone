<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#1e3a5f;--line:#e2e8f2;--dn:#b91c1c;--warn:#92400e;--warnbg:#fef3c7}
:root[data-theme=dark]{--bg:#10151d;--card:#18202c;--ink:#e5e9f0;--mut:#9aa6b8;--pri:#7fb0ff;--line:#2a3547;--dn:#f08585;--warn:#fcd34d;--warnbg:#3a2f12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}

input,select{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;margin-bottom:10px}.row>div{flex:1;min-width:0}
.go{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--bg);font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;margin-bottom:12px}
.rng{color:var(--mut);font-size:.82rem;margin:-4px 0 10px;line-height:1.6}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.88rem;margin-bottom:10px;line-height:1.6}
.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
pre{white-space:pre-wrap;word-wrap:break-word;margin:0;font:inherit;font-size:1rem;line-height:1.75}
.out,.out *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.err{color:var(--dn);text-align:center;padding:12px;font-size:.92rem}
[hidden]{display:none!important}

  $('rng').textContent = 'البيانات المتاحة من ' + dm(first) + ' إلى ' + dm(lastFull) + (D.live ? '، واليوم ' + dm(D.live.date) + ' حتى الساعة ' + clock(D.live.taken) + ' (آخر تحديث لليومية المباشرة)' : ' (يُضاف يوم جديد كل ليلة)');
  $('go').onclick = run; sp.onchange = run; run();
}
function run(){
  let a = $('from').value, b = $('to').value, br = $('br').value; $('err').textContent = '';
  if(!a || !b){ $('err').textContent = 'اختر التاريخين'; return; }
  if(a > b){ const x = a; a = b; b = x; $('from').value = a; $('to').value = b; }
  const tot = {}, miss = []; let n = 0;
  for(let d = a; d <= b; d = addDays(d, 1)){
    const day = D.days[d] && D.days[d][br];
    if(!day){ miss.push(d); continue; }
    n++; day.forEach(([i, v]) => { tot[i] = (tot[i] || 0) + v; });
  }
  const rows = Object.entries(tot).filter(([, v]) => v !== 0).sort((x, y) => y[1] - x[1]);
  const w = $('warn');
  if(miss.length){ w.hidden = false; w.textContent = '⚠️ لا توجد بيانات محفوظة لـ' + (miss.length === 1 ? 'يوم واحد' : miss.length === 2 ? 'يومين' : ' ' + miss.length + (miss.length <= 10 ? ' أيام' : ' يومًا')) + ' في هذه الفترة ولم ' + (miss.length === 1 ? 'يُحسب' : 'تُحسب') + ': ' + (miss.length > 12 ? miss.slice(0, 12).map(dm).join('، ') + ' …' : miss.map(dm).join('، ')); }
  else w.hidden = true;
  if(!n){ $('out').hidden = true; $('err').textContent = 'لا توجد بيانات لهذه الفترة'; return; }
  let per = a === b ? 'يوم ' + dm(a) : 'من ' + dm(a) + ' إلى ' + dm(b); const one = $('sp').value, L = [];
  if(D.live && a <= D.live.date && D.live.date <= b && D.days[D.live.date] && D.days[D.live.date][br]) per += (a === b ? ' — حتى الساعة ' : ' (اليوم حتى الساعة ') + clock(D.live.taken) + (a === b ? '' : ')');
  if(one === '' && D.lite){ $('out').hidden = true; $('err').textContent = 'اختر المورد من القائمة أو ابحث باسمه أو رقمه'; return; }
  if(one === ''){  // كل الموردين + الإجمالي
    L.push('مبيعات الموردين (' + br + ')', per, 'عدد الموردين ' + rows.length, '_________________________');
    rows.forEach(([i, v], k) => L.push((k + 1) + '. ' + D.sups[i] + ' — ' + fmt(v)));
    L.push('', 'الإجمالي: ' + fmt(rows.reduce((t, [, v]) => t + v, 0)));
  } else {  // مورد واحد: مجموعه في الفترة وترتيبه، ومع «كل الفروع» توزيعه على الفروع
    const k = rows.findIndex(([i]) => i === one);
    L.push('مبيعات المورد ' + D.sups[+one] + ' (' + br + ')', per, '_________________________');
    if(k < 0){ L.push('لا توجد مبيعات لهذا المورد في هذه الفترة'); }
    else {
      L.push('المبيعات: ' + fmt(rows[k][1]), 'ترتيبه: ' + (k + 1) + ' من ' + rows.length + ' موردًا');
      if(br === D.branches[0]){
        const pb = {}; D.branches.slice(1).forEach(x => pb[x] = 0);
        for(let d = a; d <= b; d = addDays(d, 1)) D.branches.slice(1).forEach(x => { const r = D.days[d] && D.days[d][x]; if(r) r.forEach(([i, v]) => { if(i === +one) pb[x] += v; }); });
        L.push('', 'حسب الفرع:'); Object.entries(pb).filter(([, v]) => v !== 0).sort((x, y) => y[1] - x[1]).forEach(([x, v]) => L.push(x + ' — ' + fmt(v)));
      }
    }
    if(D.lite && D.stock && D.stock.locs){  // المخزون الحالي للمورد (آخر لقطة، بسعر البيع)
      const sv = D.stock.v[one], hd = 'المخزون الحالي بسعر البيع (نهاية ' + dm(D.stock.date) + ')';
      L.push('', '_________________________', hd + ':');
      if(!sv) L.push('لا يوجد مخزون مسجل لهذا المورد');
      else if(br === D.branches[0]){
        D.stock.locs.forEach((x, j) => { if(sv[j]) L.push(x + ' — ' + fmt(sv[j])); });
        L.push('مجموع مخزون المورد: ' + fmt(sv.reduce((t, x) => t + x, 0)));
      } else { const j = D.stock.locs.indexOf(br); L.push(br + ' — ' + fmt(j >= 0 ? sv[j] : 0)); }
    }
  }
  $('txt').textContent = L.join('\n'); $('out').hidden = false;
}
['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(ev => $('out').addEventListener(ev, e => e.preventDefault()));  // بلا نسخ (طلب 2026-11-12)
const SK = 'ssk:' + location.pathname;  // مفتاح لكل صفحة (النسختان على نفس النطاق)

const BUILD = +document.querySelector('meta[name=build]').content; let lastCheck = 0;
async function checkUpdate(){

  try { const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    const m = (await r.text()).match(/name="build" content="([0-9]+)"/);

}
