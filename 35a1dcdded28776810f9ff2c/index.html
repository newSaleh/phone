<title>متابعة التنزيل (شاملة)</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#1e3a5f;--line:#e2e8f2;--dn:#b91c1c;--head:#eef2f8;--chip:#fff}
:root[data-theme=dark]{--bg:#10151d;--card:#18202c;--ink:#e5e9f0;--mut:#9aa6b8;--pri:#7fb0ff;--line:#2a3547;--dn:#f08585;--head:#1f2a3a;--chip:#18202c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:1.15rem;margin:0;color:var(--pri)}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer}
select,input{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--chip);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pri);color:var(--bg);border-color:var(--pri)}
.chip b{font-weight:700;margin-inline-start:4px}
@media (min-width:1000px){  /* الكمبيوتر (2026-11-18): الفروع في عمودين، والملخص والمتابعة بعرض كامل */
  .wrap{max-width:1280px;padding:14px 16px}
  #out.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  #out.two > :not(.sec){grid-column:1/-1}
  #out.two > .sec{margin-bottom:0}
}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--head);border-bottom:1px solid var(--line)}
.sh h2{margin:0;font-size:1.08rem;color:var(--pri)}
.sh .meta{color:var(--mut);font-size:.84rem;margin-top:3px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{background:var(--card);color:var(--mut);font-weight:600;font-size:.76rem;padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:top}
tr:last-child td{border-bottom:0}
td.m{text-align:right}
td.m .md{font-weight:700;direction:ltr;unicode-bidi:isolate;display:inline-block}
td.m .md.link{color:var(--pri);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
td.m small{display:block;color:var(--mut);font-size:.74rem;margin-top:1px}
td.m .rp{display:block;color:var(--dn);font-size:.74rem;font-weight:600}
td.k{color:var(--mut);font-size:.76rem;cursor:pointer;-webkit-user-select:none;user-select:none;min-width:26px}
td.k.x{color:var(--dn);font-weight:700}
tr.off td{opacity:.35}
tr.off td.k{opacity:1}
tr.off .md{text-decoration:line-through}
.hid{color:var(--dn);cursor:pointer;text-decoration:underline}
.mv td{background:var(--head);text-align:right;padding:8px 10px;font-size:.82rem;line-height:1.75}
.mv .v{font-weight:700}.mv .g{color:#15803d}.mv .y{color:#b45309}.mv .r{color:var(--dn)}
.mv .dl{color:var(--mut)}
td.m .jd{display:block;font-size:.76rem;font-weight:700;margin-top:1px}
.jd.r{color:var(--dn)}.jd.y{color:#b45309}.jd.g{color:#15803d}.jd.n{color:var(--mut)}.jd.d{color:#2563eb}.jd.s{color:var(--mut);font-weight:600}
.fa{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.fa button{padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:.78rem;cursor:pointer}
:root[data-theme=dark] .jd.d{color:#7fb0ff}
:root[data-theme=dark] .jd.y{color:#fbbf24}:root[data-theme=dark] .jd.g{color:#4ade80}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px}
.mv .ask{margin-top:6px;padding:6px 10px;border:1px solid var(--pri);border-radius:8px;background:var(--card);color:var(--pri);font:inherit;font-size:.82rem;cursor:pointer}
:root[data-theme=dark] .mv .g{color:#4ade80}:root[data-theme=dark] .mv .y{color:#fbbf24}
td.q{font-weight:700}
.sync{font-size:.78rem;color:var(--mut);margin:-4px 2px 8px;cursor:pointer}
.am{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.am h3{margin:0 0 6px;font-size:1rem;color:var(--pri)} .am table{width:100%} .am td,.am th{padding:5px 4px;font-size:.88rem}
.am tr.go{cursor:pointer} .am tr.go:hover td{background:var(--head)} .am .r{color:var(--dn);font-weight:700} .am .y{color:#b45309;font-weight:700}
.am .tip{font-size:.8rem;color:var(--mut);margin-top:6px;line-height:1.7} .am .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.jd.ivd{color:#b45309;font-weight:700}:root[data-theme=dark] .jd.ivd{color:#fbbf24}
.setb{display:block;margin-top:2px;font-size:.66rem;font-weight:700;color:#6d28d9;white-space:nowrap}:root[data-theme=dark] .setb{color:#c4b5fd}
td.b{color:var(--dn);font-weight:700}
.empty{padding:14px;color:var(--mut);text-align:center;font-size:.9rem}
.err{color:var(--dn);text-align:center;padding:12px;font-size:.92rem}
.note{color:var(--mut);font-size:.8rem;margin:-2px 2px 10px;line-height:1.6}
.mt{width:100%;border-collapse:collapse;margin-top:4px;font-size:.8rem}
.mt td,.mt th{padding:3px 6px;text-align:center;border-bottom:1px solid var(--line);background:var(--card)}
.mt tr.s td{color:var(--dn)}.mt tr.i td{color:#2563eb}.mt tr.o td{color:#b45309}
:root[data-theme=dark] .mt tr.i td{color:#7fb0ff}:root[data-theme=dark] .mt tr.o td{color:#fbbf24}
.mvx{margin-top:6px;font-size:.82rem;line-height:1.7}.mvx .h{font-weight:700;margin-top:6px}.mvx .v{font-weight:700}.mvx .dl{color:var(--mut)}
.mvx .ask{margin-top:6px;padding:4px 9px;border:1px solid var(--pri);border-radius:8px;background:var(--card);color:var(--pri);font:inherit;font-size:.78rem;cursor:pointer}
.pdfmode .noprint{display:none!important}
[hidden]{display:none!important}
</style></head><body><style>.brand{display:block;margin:10px auto 2px;height:40px;width:auto}@media (display-mode:standalone){.brand{margin-top:calc(env(safe-area-inset-top) + 30px)}}</style><img class="brand" src="../logo-s.png?v=2" alt="الهرم" width="110" height="40" decoding="async" onerror="this.remove()"><script>if(window.parent!==window)document.querySelector(".brand").remove()</script><div class="wrap">

async function makePdf(b, day, btn, F){
  const old = btn.textContent; btn.disabled = true; btn.textContent = '⏳ جارٍ التجهيز…'; const rows0 = F ? null : outRows(b, day);
  try {
    if(!window.jspdf) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const cv = pdfCanvas(b, day, F); if(rows0) recordSent(b, day, rows0);  // بعد الرسم: وإلا أخفاها «المُرسل للمتابعة: مخفي» فيخرج PDF فارغًا (إصلاح 2026-11-17)
    const {jsPDF} = window.jspdf, W = 420, H = cv.height * W / cv.width, PAGE = 1400;  // صفحات طويلة بعرض الجوال
    const h0 = Math.min(H, PAGE), ori = h => h < W ? 'landscape' : 'portrait';  // صفحة أعرض من طولها (بحث بنتائج قليلة) تُقلب وتنقص إن لم يُحدَّد الاتجاه
    const pdf = new jsPDF({unit: 'pt', format: [W, h0], orientation: ori(h0), compress: true}), sliceH = Math.round(PAGE * cv.width / W);
    for(let y = 0, pg = 0; y < cv.height; y += sliceH, pg++){
      const part = document.createElement('canvas'); part.width = cv.width; part.height = Math.min(sliceH, cv.height - y);
      part.getContext('2d').drawImage(cv, 0, y, cv.width, part.height, 0, 0, cv.width, part.height);
      const ph = part.height * W / cv.width; if(pg) pdf.addPage([W, ph], ori(ph));
      pdf.addImage(part.toDataURL('image/jpeg', 0.55), 'JPEG', 0, 0, W, ph, undefined, 'FAST');
    }
    const q = $('q').value.trim().replace(/[\/:*?"<>|]/g, ''), name = F ? F.name : 'متابعة التنزيل - ' + b + ' - ' + day + (q ? ' - ' + q : '') + '.pdf', blob = pdf.output('blob'), file = new File([blob], name, {type: 'application/pdf'});
    // الكمبيوتر: تحميل مباشر بدل نافذة المشاركة (طلب 2026-11-16)
    if((PHONE || !MV) && navigator.canShare && navigator.canShare({files: [file]})){ try { await navigator.share({files: [file], title: name}); } catch(e){ if(e.name !== 'AbortError') throw e; } }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); }
  } catch(e){ $('err').textContent = 'تعذّر إنشاء PDF، حاول مرة أخرى'; }
  finally { btn.disabled = false; btn.textContent = old; }
}

const BUILD = +document.querySelector('meta[name=build]').content; let lastCheck = 0;
async function checkUpdate(){

  try { const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    const m = (await r.text()).match(/name="build" content="([0-9]+)"/);

}
