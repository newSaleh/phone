:root[data-theme=dark]{--bg:#10151d;--card:#18202c;--ink:#e5e9f0;--mut:#9aa6b8;--pri:#7fb0ff;--onpri:#10151d;--line:#2a3547;--grn:#52b58c;--ongrn:#0f1d17;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center}
h1{font-size:1.2rem;margin:0;color:var(--pri);}
input,select{width:100%;font:inherit;font-size:1.05rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);}
.tools select{width:auto;font-size:.9rem;padding:6px 8px}
input{direction:ltr;text-align:center;}
.theme{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;white-space:nowrap;cursor:pointer}
.row{display:flex;gap:8px;margin-top:10px}
.go{flex:1;display:block;padding:13px 10px;border:0;border-radius:10px;background:var(--grn);color:var(--ongrn);font:inherit;font-size:1.05rem;text-align:center;text-decoration:none;cursor:pointer}
.go small{opacity:.85;font-size:.82rem;margin-inline-start:6px}
.go.all{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.sv{flex:0 0 auto;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.go:disabled,.sv:disabled{opacity:.5;cursor:default}
.note{color:var(--mut);font-size:.92rem;margin-top:12px;line-height:1.7}
.err{color:#b91c1c;margin-top:10px;min-height:1.2em;font-size:.95rem}
.ready{margin-top:12px;padding:10px;border:1px dashed var(--pri);border-radius:10px;text-align:center}
.ready a{color:var(--pri);font-weight:700}
[hidden]{display:none!important}

    const url = await blobOf(f); stat(save ? 'save' : 'file', f.k, day);
    if(save){ const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
    else if(!window.open(url, '_blank')){ const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = t().tap;
      $('ready').textContent = ''; $('ready').appendChild(a); $('ready').hidden = false; }
  } catch(_){ $('err').textContent = t().fail; }
  btn.disabled = false; btn.textContent = old;
}
function render(i){
  const d = idx.days[i], box = $('btns'); box.textContent = ''; $('ready').hidden = true; $('err').textContent = '';
  $('meta').textContent = t().sales + ' ' + dayLabel(d.date) + ' — ' + t().released + ' ' + clock(d.saved);
  const row = (label, f, cls) => { const r = document.createElement('div'); r.className = 'row';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'go ' + (cls || ''); b.textContent = label;
    const s = document.createElement('small'); s.textContent = kb(f.size); b.appendChild(s); b.onclick = () => act(f, false, b, d.date);
    const v = document.createElement('button'); v.type = 'button'; v.className = 'sv'; v.textContent = '⬇ ' + t().save; v.onclick = () => act(f, true, v, d.date);
    r.appendChild(b); r.appendChild(v); box.appendChild(r); };
  const own = d.files.filter(f => f.k !== 'all'), all = d.files.find(f => f.k === 'all');
  own.forEach(f => row(t().br[f.k] || f.k, f, ''));
  if(all) row(t().all, all, 'all');
}
async function enter(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const prev = key; key = k;
  try { idx = JSON.parse(new TextDecoder().decode(await unseal(b64(P.index)))); } catch(e){ key = prev; throw e; }
  try { localStorage.setItem('mk', pw); } catch(_){}
  $('lock').hidden = true; $('view').hidden = false; $('err').textContent = '';
  fillDays(); $('day').onchange = () => render(+$('day').value); render(0); stat('open');
}
async function tryKey(pw, silent){
  try { await enter(pw); return true; }
  catch(_){ if(silent){ try{ localStorage.removeItem('mk'); }catch(_){} } else $('err').textContent = t().wrong; $('lock').hidden = false; return false; }
}
$('enter').onclick = () => tryKey($('pw').value.trim(), false);
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') tryKey(e.target.value.trim(), false); });
document.documentElement.dataset.theme = theme; applyLang();
(async () => {
  let pw = ''; try { pw = decodeURIComponent(location.hash.slice(1)); } catch(_){}
  if(!pw){ try { pw = localStorage.getItem('mk') || ''; } catch(_){} }
  if(pw && await tryKey(pw, true)) return;
  $('lock').hidden = false;
})();

const BUILD = +document.querySelector('meta[name=build]').content; let lastCheck = 0;
async function checkUpdate(){
  if(Date.now() - lastCheck < 60000) return; lastCheck = Date.now();
  try { const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    const m = (await r.text()).match(/name="build" content="([0-9]+)"/);
    if(m && +m[1] > BUILD) location.replace(location.pathname + '?v=' + m[1] + location.hash); } catch(_){}
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(); });
