<title>يومية</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#1e3a5f;--onpri:#fff;--line:#d7deea;--sred:#b94a4a;--grn:#2f7d5c;--ongrn:#fff;}
:root[data-theme=dark]{--bg:#10151d;--card:#18202c;--ink:#e5e9f0;--mut:#9aa6b8;--pri:#7fb0ff;--onpri:#10151d;--line:#2a3547;--sred:#e08a8a;--grn:#52b58c;--ongrn:#0f1d17;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;}
.wrap{max-width:720px;margin:0 auto;padding:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
h1{font-size:1.15rem;margin:0;color:var(--pri);}
input,select{width:100%;font:inherit;font-size:1.05rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);}
input{direction:ltr;text-align:center;}
button{font:inherit;cursor:pointer;}
.go{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--pri);color:var(--onpri);font-size:1.05rem;}
.go:active{transform:scale(.98);filter:brightness(.85)}
.go:disabled{cursor:default}
.go.busy{background:var(--mut);color:var(--bg)}
.go.wait{background:var(--line);color:var(--mut);box-shadow:none}
#iask:not(.busy){background:var(--grn);color:var(--ongrn)}  /* زر البحث أخضر هادئ (طلب 2026-10-12)؛ أثناء البحث يعود رماديًا .busy */
.go.busy::before{content:'';display:inline-block;width:.9em;height:.9em;margin-inline-end:.55em;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-.1em}
@keyframes sp{to{transform:rotate(360deg)}}
.iuse-warn{color:#b45309;font-weight:700}
.hist{margin-top:12px}
.hchip{display:inline-block;padding:6px 12px;margin:6px 0 0 6px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:.9rem}
.hchip small{color:var(--mut);margin-inline-start:6px}
.hchip:active{background:var(--pri);color:var(--onpri)}
.hhead{border:0;background:transparent;color:var(--mut);font-size:.92rem;padding:4px 0}
.hclear{margin-top:6px;border:0;background:transparent;color:var(--mut);font-size:.85rem;text-decoration:underline}
.rnum{padding:2px 10px;border:1px dashed var(--pri);border-radius:999px;background:transparent;color:var(--pri);font:inherit;font-weight:700}
.rnum:active{background:var(--pri);color:var(--onpri)}
.pop{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.pop>div{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px 22px;min-width:240px;max-width:92vw;text-align:center}
.pop .pt{font-weight:700;color:var(--pri);margin-bottom:8px}
.pop .pl{direction:ltr;font-size:1.25rem;padding:3px 0}
.pop .ptot{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-weight:700}
.pop .pfirst{margin-top:6px;direction:rtl}
.pop .px{margin-top:12px}
.rankln{margin:0 0 10px;font-weight:500;color:var(--sred);text-align:center}
.rankln b{font-weight:800}
.infoln{margin:2px 0 8px;line-height:1.7}
.iname{font-weight:700}
.iprice{color:var(--mut)}
.rbtn{padding:3px 10px;border:1px solid var(--pri);border-radius:8px;background:transparent;color:var(--pri);font-size:.85rem}
.rbtn:disabled{opacity:.5}
.rbtn:active{background:var(--pri);color:var(--onpri)}
.dbtn{padding:3px 10px;border:1px solid var(--pri);border-radius:8px;background:transparent;color:var(--pri);font-size:.85rem}
.dbtn:disabled{opacity:.5}
.dbtn.on{background:var(--pri);color:var(--onpri);font-weight:700}
.tbl tr.act td{background:var(--bg)}
.tbl tr.tin td{background:rgba(60,170,100,.18)}
.tbl tr.tout td{background:rgba(220,80,80,.16)}
.tbl tr.tcnt td{background:rgba(235,190,40,.24)}  /* تلوين صفوف الكشف: تنزيل أخضر، رفع أحمر، جرد أصفر (طلب 2026-10-12) */
.cand{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1rem}
.cand:active{background:var(--pri);color:var(--onpri)}
.err{color:#b91c1c;margin-top:8px;min-height:1.2em;font-size:.95rem;}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;}
.theme{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.9rem;white-space:nowrap;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px;}
.tab{flex:1 1 30%;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1rem;}
.tab[aria-pressed=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri);}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:1.02rem;line-height:1.9;margin:0;direction:rtl;text-align:right;}
.tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:.98rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 5px;text-align:center}
.tbl th{background:var(--bg);color:var(--mut);font-weight:600;position:sticky;top:0}
.num{direction:ltr;unicode-bidi:plaintext}
.neg{color:#b91c1c;font-weight:700}
.scroll{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:6px 0}
.scroll .tbl{margin:0;font-size:.86rem}
.scroll .tbl th,.scroll .tbl td{padding:6px 3px}
.h2{font-size:1.02rem;margin:14px 0 4px;color:var(--pri);font-weight:600}
.note{color:var(--mut);font-size:.9rem}
#isup{direction:rtl;text-align:center}
[hidden]{display:none!important}
</style></head><body><div class="wrap">
<div id="lock" class="card"><div class="top"><h1>عرض محمي</h1><button class="theme" data-theme-btn></button></div>

<button class="go" id="open">فتح</button><div class="err" id="err"></div></div>

<select id="day" aria-label="التاريخ"></select><div class="tabs" id="tabs"></div><div id="livebar" hidden><div id="livemeta" class="note"></div><button class="go" id="livego"></button><div class="err" id="liveerr"></div></div><div id="rank" class="rankln" hidden></div><pre id="text"></pre>
<div id="pop" class="pop" hidden><div id="popbox"></div></div><div id="inq" hidden><input id="isup" list="sups" placeholder="المورد (الرمز أو الاسم)" autocomplete="off"><datalist id="sups"></datalist>
<input id="imod" placeholder="رقم الموديل" autocomplete="off" autocapitalize="characters" style="margin-top:8px">
<button class="go" id="iask">بحث</button><div class="note" id="iuse"></div><div class="err" id="ierr"></div><div id="icand"></div><div id="ires"></div></div></div></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, km,
                                            {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

  const M = {L: {day: '', prefix: 'snap', snap: null, loading: false, auto: false, last: 0, busy: false},

async function openSealed(key, mid, parts, total){
  const all = b64(Array.from({length: total}, (_, i) => parts[i]).join(''));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: all.slice(0, 12), additionalData: new TextEncoder().encode(mid)}, key, all.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}

function liveRequest(q, key, day){
  return new Promise(async (resolve, reject) => {
    const id = [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2, '0')).join('');
    const list = {}; let done = false;
    const es = new EventSource(q.base + '/' + q.topic + 'r/sse?since=2m');
    const fin = (e, v) => { if(done) return; done = true; clearTimeout(timer); es.close(); e ? reject(e) : resolve(v); };
    const timer = setTimeout(() => { const e = new Error('لم يصل رد، حاول لاحقًا'); e.timeout = true; fin(e); }, 300000);
    es.onmessage = async ev => {
      let o; try { const m = JSON.parse(ev.data); if(m.event !== 'message') return; o = JSON.parse(m.message); } catch(_){ return; }
      if(o.id !== id + 'y') return; list[o.n] = o.d;
      if(Object.keys(list).length < o.t) return;
      try { const r = await openSealed(key, o.id, list, o.t); r.ok ? fin(null, r) : fin(new Error(r.error || 'تعذّر التحديث')); }
      catch(_){ fin(new Error('رد غير صالح')); }
    };
    try {
      const iv = crypto.getRandomValues(new Uint8Array(12)), enc = u => btoa(String.fromCharCode(...u));
      const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
        new TextEncoder().encode(JSON.stringify(day ? {id, ts: Math.floor(Date.now() / 1000), k: 'live', d: day} : {id, ts: Math.floor(Date.now() / 1000), k: 'live'}))));
      const r = await fetch(q.base + '/' + q.topic + 'q', {method:'POST', body: JSON.stringify({i: enc(iv), c: enc(ct)})});

function roundTrip(q, key, code, model, onBal, onDet, onInfo, scan, onScan){
  return new Promise(async (resolve, reject) => {
    const id = [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2, '0')).join('');
    const bufs = {}; let done = false, bal = null, shown = false, det = null, inf = null, detShown = false, infShown = false;
    const es = new EventSource(q.base + '/' + q.topic + 'r/sse?since=2m');
    const fin = e => { if(done) return; done = true; clearTimeout(timer); es.close(); e ? reject(e) : resolve(); };
    const timer = setTimeout(() => fin(new Error('لم يصل رد. تأكد أن الجهاز الرئيسي شغّال وحاول لاحقًا')), 90000);
    const update = () => {
      if(bal && !shown){ shown = true; onBal(bal); }
      if(shown && det && !detShown){ detShown = true; onDet(det); }
      if(shown && inf && !infShown){ infShown = true; onInfo(inf); }
      if(shown && (!bal.pending || det) && (!bal.pend_info || inf)) fin();
    };
    const open = async (mid, list, total) => {
      const all = b64(Array.from({length: total}, (_, i) => list[i]).join(''));
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: all.slice(0, 12), additionalData: new TextEncoder().encode(mid)}, key, all.slice(12));
      return JSON.parse(new TextDecoder().decode(pt));
    };
    es.onmessage = async ev => {
      let o; try { const m = JSON.parse(ev.data); if(m.event !== 'message') return; o = JSON.parse(m.message); } catch(_){ return; }
      if(o.id !== id && o.id !== id + 'd' && o.id !== id + 'i' && o.id !== id + 's') return;
      const list = bufs[o.id] || (bufs[o.id] = {}); list[o.n] = o.d;
      if(Object.keys(list).length < o.t) return;
      let r; try { r = await open(o.id, list, o.t); } catch(_){ return fin(new Error('رد غير صالح')); }
      if(o.id === id + 's'){ if(onScan && r.ok) onScan(r); return; }  // مسح باركود: الوكيل يخبرنا بالمورد والموديل المستخرجين
      if(o.id === id){ if(!r.ok) return fin(new Error(r.error || 'تعذّر الاستعلام')); bal = r; }
      else if(o.id === id + 'd') det = r;
      else inf = r;
      update();
    };
    try {
      const iv = crypto.getRandomValues(new Uint8Array(12)), enc = u => btoa(String.fromCharCode(...u));
      const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
        new TextEncoder().encode(JSON.stringify(scan ? {id, ts: Math.floor(Date.now() / 1000), k: 'scan', m: scan}
                                                     : {id, ts: Math.floor(Date.now() / 1000), s: code, m: model}))));
      const r = await fetch(q.base + '/' + q.topic + 'q', {method:'POST', body: JSON.stringify({i: enc(iv), c: enc(ct)})});
      if(!r.ok) fin(new Error('تعذّر إرسال الطلب'));
    } catch(_){ fin(new Error('تعذّر إرسال الطلب، تحقق من الاتصال')); }
  });
}

  // البحث الذكي عن المورد (بلا backslash داخل القالب): رمز كامل أو جزئي أو اسم أو جزء من اسم؛ أسماء متشابهة = عرض أرقامها للاختيار
  const norm = t => { let o = ''; for(const ch of (t || '').trim().toLowerCase()){ const c = ch.charCodeAt(0);
    if((c >= 0x64B && c <= 0x65F) || c === 0x670 || c === 0x640) continue;
    o += (c === 0x623 || c === 0x625 || c === 0x622) ? 'ا' : c === 0x629 ? 'ه' : c === 0x649 ? 'ي' : ch; } return o; };
  const byName = {}; q.suppliers.forEach(([c, n]) => { (byName[n] || (byName[n] = {name: n, codes: []})).codes.push(c); });
  const GROUPS = Object.values(byName);
  const resolve = raw => {
    const t = raw.trim(); if(!t) return {error: 'اكتب اسم المورد أو رقمه'};
    const lead = t.match(/^([0-9]{1,4})( |$)/);
    if(lead){ const code = lead[1].padStart(4, '0');
      if(q.suppliers.some(s => s[0] === code) || lead[1].length === 4) return {code};
      const hits = GROUPS.filter(g => g.codes.some(c => c.replace(/^0+/, '').startsWith(lead[1])));
      if(!hits.length) return {error: 'لا يوجد مورد بهذا الرقم'};
      return hits.length === 1 ? {code: hits[0].codes[0]} : {cands: hits}; }
    const words = norm(t).split(' ').filter(Boolean);
    const hits = GROUPS.filter(g => { const n = norm(g.name); return words.every(w => n.includes(w)); });
    if(!hits.length) return {error: 'لا يوجد مورد بهذا الاسم'};
    const exact = hits.filter(g => norm(g.name) === norm(t));
    if(exact.length === 1) return {code: exact[0].codes[0]};
    return hits.length === 1 ? {code: hits[0].codes[0]} : {cands: hits};
  };
  const candBox = document.getElementById('icand');
  const setBusy = on => { btn.disabled = on; btn.classList.toggle('busy', on); btn.textContent = on ? 'جارٍ البحث…' : 'بحث'; };
  sup.addEventListener('input', () => { candBox.textContent = ''; });
  async function ask(){
    err.textContent = ''; candBox.textContent = ''; const model = mod.value.trim();
    if(!/^[A-Za-z0-9][A-Za-z0-9._ /-]{0,29}$/.test(model)){ err.textContent = 'اكتب رقم الموديل'; return; }
    const r0 = resolve(sup.value);
    if(r0.error){ err.textContent = r0.error; return; }
    if(r0.cands){ err.textContent = 'أكثر من مورد يطابق ما كتبت، اختر من الأرقام:';
      r0.cands.slice(0, 8).forEach(g => { const b = mk('button', g.name + ' (' + g.codes.join(' + ') + ')', 'cand');
        b.onclick = () => { sup.value = g.codes[0] + ' ' + g.name; ask(); }; candBox.appendChild(b); });
      if(r0.cands.length > 8) candBox.appendChild(mk('div', 'اكتب أكثر من الاسم لتضييق القائمة', 'note'));
      return; }
    return run(r0.code, model, null);
  }
  // ---- سجل البحث لآخر 24 ساعة داخل جهاز المستخدم فقط (localStorage؛ لا يصل لأي خادم) — طلب 2026-10-12 ----
  // يحفظ نتيجة كل استعلام ناجح (أرصدة + بيان + كشوف الفروع المعروضة + أرقام "احسب") لاستعراضها لاحقًا بلا أي استعلام ولا استهلاك من الحصة.
  const HKEY = 'h_' + q.topic, DAY_MS = 86400000, MAX_ENTRIES = 12, MAX_ENTRY = 80000, MAX_TOTAL = 250000;
  const hload = () => { try { const a = JSON.parse(localStorage.getItem(HKEY) || '[]'); return a.filter(e => e && e.bal && Date.now() - e.t < DAY_MS); } catch(_){ return []; } };
  const hsave = list => { try { let t = JSON.stringify(list); while(t.length > MAX_TOTAL && list.length > 1){ list.pop(); t = JSON.stringify(list); }
    localStorage.setItem(HKEY, t); } catch(_){} };
  // الكشف المحفوظ يُقصّ إلى أحدث 80 حركة لكل صنف توفيرًا للمساحة (الكشف الكامل يبقى في الصفحة المفتوحة)
  const slim = d => { if(!d || !d.ok) return d; const c = JSON.parse(JSON.stringify(d));
    c.detail.items.forEach(it => { if(it.rows.length > 80){ it.rows = it.rows.slice(-80); it.trunc = true; } }); return c; };
  const hput = e => {
    const x = Object.assign({}, e); delete x.det;
    if(e.dets){ x.dets = {}; Object.keys(e.dets).forEach(c => { x.dets[c] = slim(e.dets[c]); }); }
    if(JSON.stringify(x).length > MAX_ENTRY) delete x.dets;  // كشوف طويلة جدًا: نحتفظ بالأرصدة فقط
    const list = hload().filter(y => !(y.s === x.s && y.m === x.m)); list.unshift(x); hsave(list.slice(0, MAX_ENTRIES)); drawHist(); };
  const clk = ms => { const t = new Date(ms), h = t.getHours() % 12 || 12; return h + ':' + String(t.getMinutes()).padStart(2, '0') + ' ' + (t.getHours() < 12 ? 'ص' : 'م'); };
  const ago = ms => { const m = Math.floor((Date.now() - ms) / 60000); return m < 1 ? 'الآن' : m < 60 ? 'قبل ' + m + ' د' : 'قبل ' + Math.floor(m / 60) + ' س'; };
  const hbox = mk('div', undefined, 'hist'); res.parentNode.insertBefore(hbox, res);
  let hOpen = false; try{ hOpen = localStorage.getItem(HKEY + 'o') === '1'; }catch(_){}  // مطويّ افتراضيًا (يوفّر مساحة الشاشة)؛ يتذكّر آخر اختيار
  function drawHist(){
    const list = hload(); hbox.textContent = ''; hbox.hidden = !list.length; if(!list.length) return;
    const head = mk('button', (hOpen ? '▼ ' : '◀ ') + 'آخر العمليات (' + list.length + ')', 'hhead'); head.type = 'button';
    head.onclick = () => { hOpen = !hOpen; try{ localStorage.setItem(HKEY + 'o', hOpen ? '1' : '0'); }catch(_){} drawHist(); };
    hbox.appendChild(head);
    if(!hOpen) return;
    list.forEach(e => { const nm = (q.suppliers.find(x => x[0] === e.s) || [])[1] || e.s;
      const c = mk('button', nm + ' · ' + e.m, 'hchip'); c.type = 'button'; c.appendChild(mk('small', ago(e.t))); c.onclick = () => { showHist(e); hOpen = false; drawHist(); }; hbox.appendChild(c); });  // اختيار بحث يطوي القائمة
    const x = mk('button', 'مسح السجل', 'hclear'); x.type = 'button';
    x.onclick = () => { try{ localStorage.removeItem(HKEY); }catch(_){} drawHist(); }; hbox.appendChild(x);
  }
  // حالة نتيجة معروضة: st = {cc, cm, cells, bals, dbtns, rows, slot, dets: {فرع: رد الكشف}, active, pending, entry}
  const lock = (st, on) => res.querySelectorAll('.rbtn,.dbtn').forEach(x => { x.disabled = on || (!!st.pending && x.classList.contains('dbtn')); });
  const markActive = st => Object.keys(st.dbtns).forEach(c => { const on = c === st.active, bt = st.dbtns[c];
    bt.classList.toggle('on', on); bt.textContent = on ? '✓ معروض' : 'عرض'; if(st.rows[c]) st.rows[c].classList.toggle('act', on); });
  const showDet = (st, c) => { st.active = c; if(st.entry) st.entry.active = c; renderDetail(st.slot, st.dets[c]); markActive(st); };
  // معالج "احسب" المشترك بين النتيجة الحيّة والمحفوظة
  const repHandler = st => async (branch, cell, b) => {
    if(repBusy) return; repBusy = true; lock(st, true); b.textContent = '…';
    try { const v = await repRequest(q, await getKey(), st.cc, st.cm, branch);
      setRepCell(cell, v.rep[branch]); markNotDelivered(st.bals, st.cells, branch, v.rep[branch]); setUsage(v.usage);
      if(st.entry && st.entry.bal){ (st.entry.rep || (st.entry.rep = {}))[branch] = v.rep[branch]; hput(st.entry); } }
    catch(e){ err.textContent = e.message || 'تعذّر الحساب'; b.textContent = 'احسب'; }
    repBusy = false; lock(st, false); };
  // معالج "عرض" (عمود التفاصيل): كشف الفرع تحت الجدول بدل السابق. المحمَّل سابقًا يُعرض فورًا بلا طلب؛ الجديد طلب واحد يُحسب من الحصة.
  const detHandler = st => async (branch, b) => {
    if(st.dets[branch]){ showDet(st, branch); return; }
    if(repBusy || st.pending) return; repBusy = true; lock(st, true); err.textContent = '';
    const prev = st.slot.textContent; st.slot.textContent = ''; st.slot.appendChild(mk('div', 'جارٍ تحميل كشف ' + (st.rows[branch] ? st.rows[branch].children[0].textContent : branch) + '…', 'note'));
    try { const v = await detRequest(q, await getKey(), st.cc, st.cm, branch);
      st.dets[branch] = v; setUsage(v.usage); showDet(st, branch);
      if(v.detail.rep){ fillRep(st.cells, {[branch]: v.detail.rep}, st.bals); if(st.entry){ (st.entry.rep || (st.entry.rep = {}))[branch] = v.detail.rep; } }
      if(st.entry && st.entry.bal){ st.entry.dets = st.dets; hput(st.entry); } }
    catch(e){ err.textContent = e.message || 'تعذّر تحميل الكشف'; if(st.active && st.dets[st.active]) renderDetail(st.slot, st.dets[st.active]); else st.slot.textContent = ''; }
    repBusy = false; lock(st, false); };
  function showHist(e){
    if(btn.disabled) return;  // استعلام جارٍ
    err.textContent = ''; candBox.textContent = ''; res.textContent = '';
    sup.value = (e.s + ' ' + ((q.suppliers.find(x => x[0] === e.s) || [])[1] || '')).trim(); mod.value = e.m;
    res.appendChild(mk('div', 'نتيجة محفوظة من ' + clk(e.t) + ' (' + ago(e.t) + ') — اضغط "بحث" لتحديثها', 'note'));
    const box = mk('div'); res.appendChild(box);
    const st = {cc: e.s, cm: e.m, cells: {}, bals: {}, dbtns: {}, rows: {}, slot: null, active: '', pending: false, entry: e,
                dets: Object.assign({}, e.dets || (e.det && e.det.ok ? {[e.det.detail.branch]: e.det} : {}))};
    const o = renderBalances(box, Object.assign({}, e.bal, {pending: false, pend_info: false}), q, repHandler(st), detHandler(st));
    st.cells = o.cells; st.bals = o.bals; st.dbtns = o.dbtns; st.rows = o.rows; st.slot = o.slot;
    if(e.inf) fillInfo(o.infoEl, e.inf); else if(o.infoEl) o.infoEl.remove();
    Object.keys(st.dets).forEach(c => { const d = st.dets[c]; if(d && d.ok && d.detail.rep) fillRep(o.cells, {[c]: d.detail.rep}, o.bals); });
    fillRep(o.cells, e.rep || {}, o.bals);
    const first = e.active && st.dets[e.active] ? e.active : Object.keys(st.dets)[0];
    if(first && o.slot) showDet(st, first);
  }
  // تنفيذ الاستعلام؛ scan = رمز صنف ممسوح بالكاميرا (الوكيل يحوّله إلى مورد وموديل ويرسلهما فتُملأ الخانتان)
  async function run(cc, cm, scan){
    if(Date.now() - lastAt < 8000){ err.textContent = 'انتظر ثوانٍ قبل استعلام جديد'; return; }
    err.textContent = ''; candBox.textContent = '';
    lastAt = Date.now(); setBusy(true); res.textContent = ''; res.appendChild(mk('div', scan ? 'جارٍ تحديد الصنف… قد يستغرق حتى دقيقة' : 'جارٍ البحث… قد يستغرق حتى دقيقة', 'note'));
    const st = {cc, cm, cells: {}, bals: {}, dbtns: {}, rows: {}, slot: null, dets: {}, active: '', pending: false,
                entry: {t: Date.now(), s: cc, m: cm, bal: null, dets: null, inf: null, rep: {}, active: ''}};
    st.entry.dets = st.dets;
    let infoEl = null;
    try { await roundTrip(q, await getKey(), cc, cm,
            r => { setUsage(r.usage); st.pending = !!r.pending; const o = renderBalances(res, r, q, repHandler(st), detHandler(st));
              st.slot = o.slot; infoEl = o.infoEl; st.cells = o.cells; st.bals = o.bals; st.dbtns = o.dbtns; st.rows = o.rows;
              const bal = Object.assign({}, r); delete bal.usage; st.entry.bal = bal; st.entry.s = r.supplier; st.entry.m = r.model; },
            r => { st.pending = false;
              if(st.slot){ if(r.ok){ st.dets[r.detail.branch] = r; showDet(st, r.detail.branch); if(r.detail.rep) fillRep(st.cells, {[r.detail.branch]: r.detail.rep}, st.bals);
                  if(r.detail.skipped) fillRep(st.cells, r.detail.skipped, st.bals); }  // فروع تخطّاها الكشف التلقائي لأن الصنف لم ينزل فيها
                else renderDetail(st.slot, r); }
              lock(st, repBusy); },
            r => { fillInfo(infoEl, r); if(r.ok) st.entry.inf = r; },
            scan, s => { st.cc = s.supplier; st.cm = s.model; sup.value = (s.supplier + ' ' + ((q.suppliers.find(x => x[0] === s.supplier) || [])[1] || '')).trim(); if(s.model) mod.value = s.model; }); }
    catch(e){ st.pending = false; if(infoEl && infoEl.textContent.endsWith('…')) infoEl.remove(); Object.values(st.cells).forEach(el => { if(el.textContent === '…'){ el.className = 'num'; el.textContent = '–'; } });
      if(st.slot){ st.slot.textContent = ''; st.slot.appendChild(mk('div', e.message || 'تعذّر تحميل كشف الحركة', 'err')); lock(st, repBusy); }
      else { res.textContent = ''; err.textContent = e.message || 'تعذّر الاستعلام'; } }
    finally { Object.values(st.cells).forEach(el => { if(el.textContent === '…'){ el.className = 'num'; el.textContent = '–'; } }); setBusy(false);
      if(st.entry.bal && !st.entry.bal.empty) hput(st.entry); }
  }
  drawHist();
  liveCtx = {q, getKey, setUsage};
  getKey();  // اشتقاق المفتاح مسبقًا (نحو نصف ثانية) كي لا يُحسب وقت الاستعلام
  btn.onclick = ask; mod.addEventListener('keydown', e => { if(e.key === 'Enter') ask(); });
  if(window.setupScan) window.setupScan({run, known: c4 => q.suppliers.some(x => x[0] === c4)});  // أزرار الكاميرا والصورة (تُحقن لمن فُعّل له فقط)؛ known: قراءة الصور غير الواضحة لا تُقبل إلا لمورد معروف
}
async function tryOpen(pw, silent){
  try { const d = await decrypt(pw); try{localStorage.setItem('k', pw);}catch(_){} show(d, pw); }
  catch(_){ if(silent){ try{localStorage.removeItem('k');}catch(_){} } else document.getElementById('err').textContent = 'كلمة السر غير صحيحة'; }
}
document.getElementById('open').onclick = () => tryOpen(document.getElementById('pw').value.trim(), false);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') tryOpen(e.target.value.trim(), false); });
document.getElementById('logout').onclick = () => { try{localStorage.removeItem('k');}catch(_){} location.reload(); };
try { const k = localStorage.getItem('k'); if(k) tryOpen(k, true); } catch(_){}
// تحديث ذاتي للتطبيق المثبَّت: عند كل فتح وعند العودة إليه يقارن رقم النسخة بالمنشورة، ويعيد التحميل وحده إن وُجدت أحدث
// (لا حاجة لحذف التطبيق وتثبيته). المقارنة رقمية "أحدث فقط" فلا تدور الصفحة في حلقة إن أعاد CDN نسخة أقدم.
const BUILD = +document.querySelector('meta[name=build]').content; let lastCheck = 0;
async function checkUpdate(){
  if(Date.now() - lastCheck < 60000) return; lastCheck = Date.now();
  try { const r = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'});
    const m = (await r.text()).match(/name="build" content="([0-9]+)"/);
    if(m && +m[1] > BUILD) location.replace(location.pathname + '?v=' + m[1]); } catch(_){}
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(); });
checkUpdate();
</script></body></html>
