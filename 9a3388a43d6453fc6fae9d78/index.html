<title>يومية</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#1e3a5f;--onpri:#fff;--line:#d7deea;--sred:#b94a4a;--grn:#2f7d5c;--ongrn:#fff;}
:root[data-theme=dark]{--bg:#10151d;--card:#18202c;--ink:#e5e9f0;--mut:#9aa6b8;--pri:#7fb0ff;--onpri:#10151d;--line:#2a3547;--sred:#e08a8a;--grn:#52b58c;--ongrn:#0f1d17;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;}
.wrap{max-width:720px;margin:0 auto;padding:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
h1{font-size:1.15rem;margin:0;color:var(--pri);}
input,select{width:100%;font:inherit;font-size:1.05rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);}
input{direction:ltr;text-align:center;}
button{font:inherit;cursor:pointer;}
.go{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--pri);color:var(--onpri);font-size:1.05rem;}
.go:active{transform:scale(.98);filter:brightness(.85)}
.go:disabled{cursor:default}
.go.busy{background:var(--mut);color:var(--bg)}
.go.wait{background:var(--line);color:var(--mut);box-shadow:none}
#iask:not(.busy){background:var(--grn);color:var(--ongrn)}  /* زر البحث أخضر هادئ (طلب 2026-10-12)؛ أثناء البحث يعود رماديًا .busy */
.go.busy::before{content:'';display:inline-block;width:.9em;height:.9em;margin-inline-end:.55em;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-.1em}
@keyframes sp{to{transform:rotate(360deg)}}
.iuse-warn{color:#b45309;font-weight:700}
.hist{margin-top:12px}
.hchip{display:inline-block;padding:6px 12px;margin:6px 0 0 6px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:.9rem}
.hchip small{color:var(--mut);margin-inline-start:6px}
.hchip:active{background:var(--pri);color:var(--onpri)}
.hhead{border:0;background:transparent;color:var(--mut);font-size:.92rem;padding:4px 0}
.hclear{margin-top:6px;border:0;background:transparent;color:var(--mut);font-size:.85rem;text-decoration:underline}
.rnum{padding:2px 10px;border:1px dashed var(--pri);border-radius:999px;background:transparent;color:var(--pri);font:inherit;font-weight:700}
.rnum:active{background:var(--pri);color:var(--onpri)}
.pop{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.pop>div{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px 22px;min-width:240px;max-width:92vw;text-align:center}
.pop .pt{font-weight:700;color:var(--pri);margin-bottom:8px}
.pop .pl{direction:ltr;font-size:1.25rem;padding:3px 0}
.pop .ptot{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-weight:700}
.pop .pfirst{margin-top:6px;direction:rtl}
.pop .px{margin-top:12px}
.rankln{margin:0 0 10px;font-weight:500;color:var(--sred);text-align:center}
.rankln b{font-weight:800}
.infoln{margin:2px 0 8px;line-height:1.7}
.iname{font-weight:700}
.iprice{color:var(--mut)}
.rbtn{padding:3px 10px;border:1px solid var(--pri);border-radius:8px;background:transparent;color:var(--pri);font-size:.85rem}
.rbtn:disabled{opacity:.5}
.rbtn:active{background:var(--pri);color:var(--onpri)}
.dbtn{padding:3px 10px;border:1px solid var(--pri);border-radius:8px;background:transparent;color:var(--pri);font-size:.85rem}
.dbtn:disabled{opacity:.5}
.dbtn.on{background:var(--pri);color:var(--onpri);font-weight:700}
.tbl tr.act td{background:var(--bg)}
.tbl tr.tin td{background:rgba(60,170,100,.18)}
.tbl tr.tout td{background:rgba(220,80,80,.16)}
.tbl tr.tcnt td{background:rgba(235,190,40,.24)}  /* تلوين صفوف الكشف: تنزيل أخضر، رفع أحمر، جرد أصفر (طلب 2026-10-12) */
.cand{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1rem}
.cand:active{background:var(--pri);color:var(--onpri)}
.err{color:#b91c1c;margin-top:8px;min-height:1.2em;font-size:.95rem;}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;}
.theme{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.9rem;white-space:nowrap;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px;}
.tab{flex:1 1 30%;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1rem;}
.tab[aria-pressed=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri);}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:1.02rem;line-height:1.9;margin:0;direction:rtl;text-align:right;}
.tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:.98rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 5px;text-align:center}
.tbl th{background:var(--bg);color:var(--mut);font-weight:600;position:sticky;top:0}
.num{direction:ltr;unicode-bidi:plaintext}
.neg{color:#b91c1c;font-weight:700}
.scroll{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:6px 0}
.scroll .tbl{margin:0;font-size:.86rem}
.scroll .tbl th,.scroll .tbl td{padding:6px 3px}
.h2{font-size:1.02rem;margin:14px 0 4px;color:var(--pri);font-weight:600}
.note{color:var(--mut);font-size:.9rem}
#isup{direction:rtl;text-align:center}
#modbox iframe,#watbox iframe{display:block;width:100%;min-height:460px;border:0;border-radius:10px;background:var(--bg)}
.fbar{display:flex;align-items:center;gap:6px;margin:0 0 8px}.fbar input{flex:1;min-width:0;padding:9px 12px;font-size:1rem}
.fbar .note{min-width:64px;text-align:center;white-space:nowrap}
mark{background:#ffe08a;color:#1f2937;border-radius:3px;padding:0 1px}
[hidden]{display:none!important}
</style></head><body><div class="wrap">
<div id="lock" class="card"><div class="top"><h1>عرض محمي</h1><button class="theme" data-theme-btn></button></div>

<button class="go" id="open">فتح</button><div class="err" id="err"></div></div>

<select id="day" aria-label="التاريخ"></select><div class="tabs" id="tabs"></div><div id="livebar" hidden><div id="livemeta" class="note"></div><button class="go" id="livego"></button><div class="err" id="liveerr"></div></div><div id="rank" class="rankln" hidden></div><div id="fbar" class="fbar" hidden><input id="fq" type="search" placeholder="بحث في اليومية: اسم أو رقم" autocomplete="off" enterkeyhint="search" aria-label="بحث في اليومية"><span id="fcnt" class="note"></span></div><pre id="text"></pre>
<div id="pop" class="pop" hidden><div id="popbox"></div></div><div id="modbox" hidden></div><div id="watbox" hidden></div><div id="inq" hidden><input id="isup" list="sups" placeholder="المورد (الرمز أو الاسم)" autocomplete="off"><datalist id="sups"></datalist>
<input id="imod" placeholder="رقم الموديل" autocomplete="off" autocapitalize="characters" style="margin-top:8px">
<button class="go" id="iask">بحث</button><div class="note" id="iuse"></div><div class="err" id="ierr"></div><div id="icand"></div><div id="ires"></div></div></div></div>
</div>

const root = document.documentElement;
function setTheme(t){ root.dataset.theme = t; try{localStorage.setItem('theme', t);}catch(_){}
  try{ document.querySelectorAll('#modbox iframe,#watbox iframe').forEach(f => { if(f.contentWindow) f.contentWindow.postMessage({theme: t}, '*'); }); }catch(_){}  // التبويبان المضمَّنان (الموديلات، متابعة التنزيل) يتبعان الوضع
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.textContent = t === 'dark' ? '☀️ نهاري' : '🌙 ليلي'); }
let saved = 'light'; try{ saved = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; }catch(_){}
setTheme(saved);
document.querySelectorAll('[data-theme-btn]').forEach(b => b.onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, km,
                                            {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

  const M = {L: {day: '', prefix: 'snap', snap: null, loading: false, auto: false, last: 0, busy: false},

  const clock = ts => { const t = new Date(ts * 1000), h = t.getHours() % 12 || 12; return h + ':' + pad(t.getMinutes()) + ' ' + (t.getHours() < 12 ? 'ص' : 'م'); };
  const modeNow = () => !inq ? null : sel.value === 'L' ? M.L : (d.days[curDay] && d.days[curDay].date === yesterdayStr() ? M.Y : null);
  // هل نسخة الأمس عند الطلب أحدث من التحديث الليلي المحفوظ في الصفحة؟
  const ySnapNewer = (st, s) => !!s && (!st.saved || s.taken > st.saved);
  const updateLiveBar = () => {
    const m = modeNow(); if(!m) return;
    const s = m.snap, st = m === M.Y ? d.days[curDay] : null, final = !!(st && st.final);
    if(m === M.L) livemeta.textContent = s ? 'آخر تحديث للبيانات: ' + s.at + ' — بيانات اليوم حتى هذه اللحظة' : '';
    else {
      const at = ySnapNewer(st, s) ? s.at : (st.saved ? clock(st.saved) : '');
      livemeta.textContent = !at ? '' : final ? 'التحديث النهائي لمبيعات الأمس: ' + at
        : 'آخر تحديث لمبيعات الأمس: ' + at + ' — قد تزيد المبيعات حتى التحديث النهائي نحو 3:30 ص';
    }
    const ready = !s || Date.now() / 1000 >= s.next;
    livego.hidden = final;
    livego.classList.toggle('busy', m.busy);
    livego.classList.toggle('wait', !m.busy && !ready);  // رمادي فاتح = لا يمكن التحديث الآن (التحديث التالي بعد موعد)
    livego.disabled = m.busy || !ready;
    livego.textContent = m.busy ? 'جارٍ تحديث اليومية… قد يستغرق دقيقتين'
      : !ready ? 'التحديث التالي متاح بعد ' + s.next_at
      : (m === M.Y ? 'تحديث مبيعات الأمس الآن' : (s ? 'تحديث الآن' : 'جلب يومية اليوم'));
  };
  // آخر نسخة مكتملة للنوع m ولتاريخها من قناة الردود (أو null)؛ ترفع خطأً إن تعذّر الاتصال
  const fetchSnap = async m => {
    return fetchSnapOf(m.prefix, m === M.L ? todayStr() : yesterdayStr());
  };
  const fetchSnapOf = async (prefix, want) => {
    const key = await liveCtx.getKey(), q = liveCtx.q;
    const r = await fetch(q.base + '/' + q.topic + 'r/json?poll=1&since=12h', {cache: 'no-store'});
    const groups = {};
    (await r.text()).split(String.fromCharCode(10)).forEach(line => {
      if(!line.trim()) return; let o;
      try { const j = JSON.parse(line); if(j.event !== 'message') return; o = JSON.parse(j.message); } catch(_){ return; }
      if(typeof o.id !== 'string' || o.id.slice(0, prefix.length) !== prefix) return;
      (groups[o.id] || (groups[o.id] = {t: o.t, parts: {}})).parts[o.n] = o.d; });
    const ids = Object.keys(groups).filter(i => Object.keys(groups[i].parts).length === groups[i].t).sort();
    for(let k = ids.length - 1; k >= 0; k--){
      try { const s = await openSealed(key, ids[k], groups[ids[k]].parts, groups[ids[k]].t); if(s.date === want) return s; } catch(_){}
    }
    return null;
  };
  const loadSnapshot = async m => {
    if(!liveCtx) return;
    m.loading = true; draw();
    try { m.snap = await fetchSnap(m); m.last = Date.now(); liveerr.textContent = ''; }
    catch(_){ liveerr.textContent = 'تعذّر جلب آخر نسخة، تحقق من الاتصال'; }
    m.loading = false; draw();
  };
  // التحديث: نرسل الطلب، ثم نتابع ظهور نسخة أحدث كل 6 ثوانٍ (وفور العودة للصفحة). النسخة هي النتيجة الحقيقية ومنشورة قبل الرد،
  // فلا يضيع التحديث إن فاتت الصفحةَ رسالة الرد (الهاتف مقفل أو التطبيق في الخلفية أثناء دقيقتين الانتظار).
  livego.onclick = async () => {
    const m = modeNow(); if(!m || m.busy || !liveCtx) return; m.busy = true; liveerr.textContent = ''; updateLiveBar();
    const before = m.snap ? m.snap.taken : 0; let finished = false, iv = 0, hard = 0;
    const vis = () => { if(!document.hidden) check(); };
    const finish = msg => { if(finished) return; finished = true; clearInterval(iv); clearTimeout(hard);
      document.removeEventListener('visibilitychange', vis); if(msg) liveerr.textContent = msg; m.busy = false; draw(); };
    const check = async () => {
      if(finished) return;
      try { const s = await fetchSnap(m); if(s && s.taken > before){ m.snap = s; m.last = Date.now(); finish(''); } } catch(_){}
    };
    iv = setInterval(check, 6000); hard = setTimeout(() => finish('لم يصل التحديث بعد؛ افتح هذه الصفحة بعد قليل'), 360000);
    document.addEventListener('visibilitychange', vis);
    try { const r = await liveRequest(liveCtx.q, await liveCtx.getKey(), m.day); liveCtx.setUsage(r.usage); await check(); }
    catch(e){ if(!e.timeout) finish(e.message || 'تعذّر تحديث اليومية'); }  // انتهاء مهلة الرد لا يوقف المتابعة (قد تكون النسخة وصلت)
  };
  // ---- البحث داخل اليومية (طلب 2026-10-24، ثم 2026-10-24 تعديل): تُخفى كل الأسطر إلا المتطابقة مع الاسم أو الرقم، والمطابق يُلوَّن ----
  const fbar = document.getElementById('fbar'), fq = document.getElementById('fq'), fcnt = document.getElementById('fcnt');
  let curTxt = '';
  const fnorm = t => { let o = ''; for(const ch of t){ const c = ch.charCodeAt(0);  // تطبيع بطول ثابت (حرف بحرف) كي تبقى المواضع صحيحة
    o += (c === 0x623 || c === 0x625 || c === 0x622) ? 'ا' : c === 0x629 ? 'ه' : c === 0x649 ? 'ي' : (c >= 0x660 && c <= 0x669) ? String(c - 0x660) : (c >= 0x6F0 && c <= 0x6F9) ? String(c - 0x6F0) : ch.toLowerCase(); } return o; };
  const applyFind = () => {
    const q = fnorm(fq.value.trim()); text.textContent = '';
    if(!q){ text.textContent = curTxt; fcnt.textContent = ''; return; }
    const lines = curTxt.split(String.fromCharCode(10)); let shown = 0;
    lines.forEach(line => { const hay = fnorm(line); let i = hay.indexOf(q); if(i < 0) return;
      if(shown++) text.appendChild(document.createTextNode(String.fromCharCode(10)));
      let pos = 0; while(i >= 0){ text.appendChild(document.createTextNode(line.slice(pos, i)));
        const m = document.createElement('mark'); m.textContent = line.slice(i, i + q.length); text.appendChild(m); pos = i + q.length; i = hay.indexOf(q, pos); }
      text.appendChild(document.createTextNode(line.slice(pos))); });
    if(!shown) text.textContent = 'لا توجد نتائج';
    fcnt.textContent = shown ? shown + ' نتيجة' : '0';
  };
  const showText = s => { curTxt = s; applyFind(); };
  fq.addEventListener('input', applyFind);
  fq.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); fq.blur(); } });  // Enter يُخفي لوحة المفاتيح لرؤية النتائج
  // ---- تبويب "أقوى الموديلات": نفس صفحة الموديلات القوية مضمّنة (iframe بمسارها ومفتاحها من الملف المشفّر لهذا المسؤول) ----
  const modBox = document.getElementById('modbox'), modelsIdx = d.names.length + (inq ? 1 : 0);
  const watBox = document.getElementById('watbox'), watIdx = modelsIdx + (d.models ? 1 : 0);  // تبويب "متابعة التنزيل" (التحلية فقط، 2026-10-29): صفحة مشفّرة مضمَّنة مثل الموديلات
  let watFrame = null, watTimer = 0;
  const openWatch = () => {
    if(!watFrame){ watFrame = document.createElement('iframe'); watFrame.title = 'متابعة التنزيل';
      watFrame.src = new URL('../' + d.watch.path + '/index.html', location.href).href + '#' + encodeURIComponent(d.watch.pw); watBox.appendChild(watFrame);
      watFrame.onload = () => { try{ watFrame.contentWindow.postMessage({theme: root.dataset.theme}, '*'); }catch(_){} }; }
    clearInterval(watTimer);
    watTimer = setInterval(() => { if(watBox.hidden){ clearInterval(watTimer); return; }
      try { const h = watFrame.contentDocument.documentElement.scrollHeight; if(h > 300) watFrame.style.height = (h + 4) + 'px'; } catch(_){} }, 500);
  };
  // زر "تحديث الآن" داخل متابعة التنزيل: الصفحة المضمَّنة لا تملك مفتاح الاستعلام، فتطلب من هذه الصفحة (watch: get | refresh) وتردّ عليها بالنسخة
  let watBusy = false;
  const toWat = msg => { try { watFrame.contentWindow.postMessage(msg, '*'); } catch(_){} };
  window.addEventListener('message', async e => {
    if(!watFrame || e.source !== watFrame.contentWindow || !e.data || !e.data.watch) return;
    if(!liveCtx){ toWat({watch: 'err', msg: 'التحديث غير متاح لرابطك'}); return; }
    if(e.data.watch === 'get'){
      try { const snap = await fetchSnapOf('wsnap', todayStr()); toWat({watch: 'snap', snap, ysnap: snap && snap.prev ? null : await fetchSnapOf('wsnap', yesterdayStr())}); }
      catch(_){ toWat({watch: 'err', msg: 'تعذّر جلب آخر نسخة، تحقق من الاتصال'}); }
    } else if(e.data.watch === 'refresh' && !watBusy){
      watBusy = true; const since = +e.data.since || 0;
      try {
        await liveRequest(liveCtx.q, await liveCtx.getKey(), '', 'watch');
        let s = null;
        for(let k = 0; k < 4; k++){ s = await fetchSnapOf('wsnap', todayStr()); if(s && s.taken > since) break; await new Promise(r => setTimeout(r, 1500)); }  // النسخة تُنشر قبل الرد؛ تأخر ntfy يُعاد له
        toWat({watch: 'snap', snap: s, ysnap: s && s.prev ? null : await fetchSnapOf('wsnap', yesterdayStr())});
      } catch(err){ toWat({watch: 'err', msg: err.message || 'تعذّر التحديث'}); }
      finally { watBusy = false; }
    }
  });
  let modFrame = null, modTimer = 0;
  const openModels = () => {
    if(!modFrame){ modFrame = document.createElement('iframe'); modFrame.title = 'أقوى الموديلات';
      modFrame.src = new URL('../' + d.models.path + '/index.html', location.href).href + '#' + encodeURIComponent(d.models.pw); modBox.appendChild(modFrame);
      modFrame.onload = () => { try{ modFrame.contentWindow.postMessage({theme: root.dataset.theme}, '*'); }catch(_){} }; }
    clearInterval(modTimer);  // يتبع ارتفاع الصفحة المضمّنة (نفس النطاق) كي لا يظهر شريط تمرير داخلي؛ عند تعذّر القراءة يبقى الارتفاع الأدنى
    modTimer = setInterval(() => { if(modBox.hidden){ clearInterval(modTimer); return; }
      try { const h = modFrame.contentDocument.documentElement.scrollHeight; if(h > 300) modFrame.style.height = (h + 4) + 'px'; } catch(_){} }, 500);
  };
  const draw = () => { [...tabs.children].forEach((b, i) => b.setAttribute('aria-pressed', i === curTab));
    const isInq = !!inq && curTab === d.names.length, isMod = !!d.models && curTab === modelsIdx, isWat = !!d.watch && curTab === watIdx, m = (isInq || isMod || isWat) ? null : modeNow();
    sel.hidden = text.hidden = fbar.hidden = isInq || isMod || isWat; inqBox.hidden = !isInq; modBox.hidden = !isMod; watBox.hidden = !isWat; livebar.hidden = !m;
    if(isMod) openModels();
    if(isWat) openWatch();
    let rk = null;
    if(!isInq && !isMod && !isWat){
      const nm = d.names[curTab];
      if(m === M.L){  // يومية اليوم (مباشر): النسخة المشتركة الأخيرة؛ ترتيبها من النسخة نفسها
        const s = m.snap;
        showText(nm === 'كل الفروع' ? 'يومية اليوم المباشرة متاحة للفروع فقط، اختر فرعًا.'
          : s ? (s.texts[nm] || (s.missing && s.missing.includes(nm) ? 'تعذّر جلب بيانات هذا الفرع في آخر تحديث (انقطاع عابر في الاتصال بالنظام). يمكنك إعادة المحاولة بالضغط على «تحديث الآن» بعد ' + s.next_at + '.' : 'لا توجد بيانات لهذا الفرع في آخر تحديث.')) : (m.loading ? 'جارٍ تحميل آخر نسخة…' : 'لم تُجلب يومية اليوم بعد.'));
        rk = s && s.ranks ? s.ranks[nm] : null;
      } else {
        const st = d.days[curDay]; let txts = st.texts, rks = st.ranks || {};
        if(m === M.Y && ySnapNewer(st, m.snap)){ txts = m.snap.texts; rks = m.snap.ranks || {}; }  // تحديث الأمس عند الطلب أحدث من الليلي
        showText((m === M.Y && txts !== st.texts && nm === 'كل الفروع') ? 'مجموع كل الفروع يُحسب في التحديث الليلي؛ اختر فرعًا لرؤية آخر تحديث.'
          : (txts[nm] || 'لا توجد بيانات لهذا الفرع في هذا اليوم.'));
        // ترتيب الفرع بين الفروع في اليوم المختار (بحسب مجموع مبيعات الموردين في اليومية)
        rk = rks[nm];
      }
      if(m){ updateLiveBar(); if(!m.snap && !m.loading && !m.auto){ m.auto = true; loadSnapshot(m); } }  // أول فتح: اقرأ آخر نسخة تلقائيًا (بلا استهلاك)
    }
    rankEl.hidden = !(rk && rk[1] >= 2);
    if(!rankEl.hidden){  // "ترتيب فرعك الثاني لهذا اليوم" (صياغة المستخدم)؛ يُذكر عدد الفروع فقط إن لم يكن 5 (غياب بيانات فرع)
      const ord = ['', 'الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس'][rk[0]] || ('رقم ' + rk[0]);
      rankEl.textContent = (d.rankOwn ? 'فرعك' : 'هذا الفرع') + ' في المركز (';  // صياغة المستخدم: الترتيبي بين قوسين وتحته خط
      const b = document.createElement('b'); b.textContent = ord; rankEl.appendChild(b);
      rankEl.appendChild(document.createTextNode(')' + (rk[1] !== 5 ? ' من بين ' + rk[1] + ' فروع' : '') + ' لهذا اليوم')); } };
  d.names.forEach((n, i) => { const t = document.createElement('button'); t.className = 'tab'; t.textContent = n;
    t.onclick = () => { curTab = i; draw(); }; tabs.appendChild(t); });
  if(inq){ const t = document.createElement('button'); t.className = 'tab'; t.textContent = '🔎 استعلام';
    t.onclick = () => { curTab = d.names.length; draw(); }; tabs.appendChild(t); setupInquiry(inq, pw); }
  if(d.models){ const t = document.createElement('button'); t.className = 'tab'; t.textContent = '🔥 الموديلات';
    t.onclick = () => { curTab = modelsIdx; draw(); }; tabs.appendChild(t); }
  if(d.watch){ const t = document.createElement('button'); t.className = 'tab'; t.textContent = '📋 متابعة التنزيل';
    t.onclick = () => { curTab = watIdx; draw(); }; tabs.appendChild(t); }
  if(!d.names.length) tabs.hidden = true;  // رابط استعلام فقط: لا حاجة لشريط تبويب واحد
  sel.onchange = () => { curDay = sel.value === 'L' ? -1 : +sel.value; const m = modeNow(); if(m && Date.now() - m.last > 60000) loadSnapshot(m); else draw(); };
  draw();
}
// ---- تبويب "استعلام": الطلب والرد مشفّران بمفتاح من كلمة السر ويمرّان عبر ntfy.sh إلى الجهاز الرئيسي الذي يستعلم من ERP ----
const mk = (tag, txt, cls) => { const e = document.createElement(tag); if(txt !== undefined) e.textContent = txt; if(cls) e.className = cls; return e; };
const numCell = (v, dash) => mk('td', dash && v === 0 ? '–' : String(v), 'num' + (v < 0 ? ' neg' : ''));
function tableOf(heads){ const t = mk('table', undefined, 'tbl'), tr = mk('tr'); heads.forEach(h => tr.appendChild(mk('th', h)));
  t.appendChild(mk('thead')).appendChild(tr); t.appendChild(mk('tbody')); return t; }
// يرسل الطلب ويستقبل رسالتين مشفّرتين: الأرصدة فورًا (onBal) ثم كشف الحركة (onDet) إن كان مطلوبًا لهذا المستلم.
let liveCtx = null;  // يضبطه setupInquiry: {q, getKey, setUsage}
async function openSealed(key, mid, parts, total){
  const all = b64(Array.from({length: total}, (_, i) => parts[i]).join(''));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: all.slice(0, 12), additionalData: new TextEncoder().encode(mid)}, key, all.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
// طلب تحديث "يومية اليوم (مباشر)": يستغرق نحو دقيقتين (5 فروع)؛ الرد على معرّف الطلب + y
function liveRequest(q, key, day, kind){  // kind: 'live' (الافتراضي، الرد +y) أو 'watch' (متابعة التنزيل، الرد +w)
  const sfx = kind === 'watch' ? 'w' : 'y';
  return new Promise(async (resolve, reject) => {
    const id = [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2, '0')).join('');
    const list = {}; let done = false;
    const es = new EventSource(q.base + '/' + q.topic + 'r/sse?since=2m');
    const fin = (e, v) => { if(done) return; done = true; clearTimeout(timer); es.close(); e ? reject(e) : resolve(v); };
    const timer = setTimeout(() => { const e = new Error('لم يصل رد، حاول لاحقًا'); e.timeout = true; fin(e); }, 300000);
    es.onmessage = async ev => {
      let o; try { const m = JSON.parse(ev.data); if(m.event !== 'message') return; o = JSON.parse(m.message); } catch(_){ return; }
      if(o.id !== id + sfx) return; list[o.n] = o.d;
      if(Object.keys(list).length < o.t) return;
      try { const r = await openSealed(key, o.id, list, o.t); r.ok ? fin(null, r) : fin(new Error(r.error || 'تعذّر التحديث')); }
      catch(_){ fin(new Error('رد غير صالح')); }
    };
    try {
      const iv = crypto.getRandomValues(new Uint8Array(12)), enc = u => btoa(String.fromCharCode(...u));
      const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
        new TextEncoder().encode(JSON.stringify(day ? {id, ts: Math.floor(Date.now() / 1000), k: 'live', d: day} : {id, ts: Math.floor(Date.now() / 1000), k: kind || 'live'}))));
      const r = await fetch(q.base + '/' + q.topic + 'q', {method:'POST', body: JSON.stringify({i: enc(iv), c: enc(ct)})});
      if(!r.ok) fin(new Error('تعذّر إرسال الطلب'));
    } catch(_){ fin(new Error('تعذّر إرسال الطلب، تحقق من الاتصال')); }
  });
}
function roundTrip(q, key, code, model, onBal, onDet, onInfo, scan, onScan){
  return new Promise(async (resolve, reject) => {
    const id = [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2, '0')).join('');
    const bufs = {}; let done = false, bal = null, shown = false, det = null, inf = null, detShown = false, infShown = false;
    const es = new EventSource(q.base + '/' + q.topic + 'r/sse?since=2m');
    const fin = e => { if(done) return; done = true; clearTimeout(timer); es.close(); e ? reject(e) : resolve(); };
    const timer = setTimeout(() => fin(new Error('لم يصل رد. تأكد أن الجهاز الرئيسي شغّال وحاول لاحقًا')), 90000);
    const update = () => {
      if(bal && !shown){ shown = true; onBal(bal); }
      if(shown && det && !detShown){ detShown = true; onDet(det); }
      if(shown && inf && !infShown){ infShown = true; onInfo(inf); }
      if(shown && (!bal.pending || det) && (!bal.pend_info || inf)) fin();
    };
    const open = async (mid, list, total) => {
      const all = b64(Array.from({length: total}, (_, i) => list[i]).join(''));
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: all.slice(0, 12), additionalData: new TextEncoder().encode(mid)}, key, all.slice(12));
      return JSON.parse(new TextDecoder().decode(pt));
    };
    es.onmessage = async ev => {
      let o; try { const m = JSON.parse(ev.data); if(m.event !== 'message') return; o = JSON.parse(m.message); } catch(_){ return; }
      if(o.id !== id && o.id !== id + 'd' && o.id !== id + 'i' && o.id !== id + 's') return;
      const list = bufs[o.id] || (bufs[o.id] = {}); list[o.n] = o.d;
      if(Object.keys(list).length < o.t) return;
      let r; try { r = await open(o.id, list, o.t); } catch(_){ return fin(new Error('رد غير صالح')); }
      if(o.id === id + 's'){ if(onScan && r.ok) onScan(r); return; }  // مسح باركود: الوكيل يخبرنا بالمورد والموديل المستخرجين
      if(o.id === id){ if(!r.ok) return fin(new Error(r.error || 'تعذّر الاستعلام')); bal = r; }
      else if(o.id === id + 'd') det = r;
      else inf = r;
      update();
    };
    try {
      const iv = crypto.getRandomValues(new Uint8Array(12)), enc = u => btoa(String.fromCharCode(...u));
      const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
        new TextEncoder().encode(JSON.stringify(scan ? {id, ts: Math.floor(Date.now() / 1000), k: 'scan', m: scan}
                                                     : {id, ts: Math.floor(Date.now() / 1000), s: code, m: model}))));
      const r = await fetch(q.base + '/' + q.topic + 'q', {method:'POST', body: JSON.stringify({i: enc(iv), c: enc(ct)})});
      if(!r.ok) fin(new Error('تعذّر إرسال الطلب'));
    } catch(_){ fin(new Error('تعذّر إرسال الطلب، تحقق من الاتصال')); }
  });

// طلب "احسب التكرار" لفرع واحد: رسالة مشفّرة واحدة ← رد واحد بمعرّف الطلب + r
function repRequest(q, key, code, model, branch){
  return new Promise(async (resolve, reject) => {
    const id = [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2, '0')).join('');
    const list = {}; let done = false;
    const es = new EventSource(q.base + '/' + q.topic + 'r/sse?since=2m');
    const fin = (e, v) => { if(done) return; done = true; clearTimeout(timer); es.close(); e ? reject(e) : resolve(v); };
    const timer = setTimeout(() => fin(new Error('لم يصل رد، حاول لاحقًا')), 90000);
    es.onmessage = async ev => {
      let o; try { const m = JSON.parse(ev.data); if(m.event !== 'message') return; o = JSON.parse(m.message); } catch(_){ return; }
      if(o.id !== id + 'r') return; list[o.n] = o.d;
      if(Object.keys(list).length < o.t) return;
      try { const all = b64(Array.from({length: o.t}, (_, i) => list[i]).join(''));
        const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: all.slice(0, 12), additionalData: new TextEncoder().encode(o.id)}, key, all.slice(12));
        const r = JSON.parse(new TextDecoder().decode(pt)); r.ok ? fin(null, r) : fin(new Error(r.error || 'تعذّر الحساب')); }
      catch(_){ fin(new Error('رد غير صالح')); }
    };
    try {
      const iv = crypto.getRandomValues(new Uint8Array(12)), enc = u => btoa(String.fromCharCode(...u));
      const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
        new TextEncoder().encode(JSON.stringify({id, ts: Math.floor(Date.now() / 1000), s: code, m: model, b: branch}))));
      const r = await fetch(q.base + '/' + q.topic + 'q', {method:'POST', body: JSON.stringify({i: enc(iv), c: enc(ct)})});
      if(!r.ok) fin(new Error('تعذّر إرسال الطلب'));
    } catch(_){ fin(new Error('تعذّر إرسال الطلب، تحقق من الاتصال')); }
  });
}

    try{
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}}, audio: false});
    } catch(e){
      finish(null);
      throw new Error(e && e.name === 'NotAllowedError' ? 'اسمح باستخدام الكاميرا لهذا الموقع من إعدادات الهاتف' : 'تعذّر تشغيل الكاميرا');
    }
    if(closed){ stream.getTracks().forEach(t => t.stop()); return done; }
    video.srcObject = stream;
    try{ await video.play(); } catch(_){}
    try{ await stream.getVideoTracks()[0].applyConstraints({advanced: [{focusMode: 'continuous'}]}); } catch(_){}
    let native = null;
    try{ if(window.BarcodeDetector && (await BarcodeDetector.getSupportedFormats()).includes('code_93')) native = new BarcodeDetector({formats: ['code_93']}); } catch(_){}
    const canvas = document.createElement('canvas'), c2 = canvas.getContext('2d', {willReadFrequently: true});
    const tick = async () => {
      if(closed) return;
      const w = video.videoWidth, h = video.videoHeight;
      if(w && h && video.readyState >= 2){
        canvas.width = w; canvas.height = h; c2.drawImage(video, 0, 0, w, h);
        let code = null;
        try{
          if(native){ const r = await native.detect(canvas); const hit = r.find(x => STOCK_RE.test(x.rawValue)); code = hit ? hit.rawValue : null; }
          else code = scanFrame(toGray(c2.getImageData(0, 0, w, h).data, w * h), w, h, {want: STOCK_RE});
        } catch(_){}
        if(code){ try{ navigator.vibrate && navigator.vibrate(60); } catch(_){} return finish(code); }
      }
      if(!closed) timer = setTimeout(tick, 120);
    };
    tick();
    return done;
  }
};
})();
</script></body></html>
