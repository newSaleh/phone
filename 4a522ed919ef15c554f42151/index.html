<script>/* مسح باركود الصنف بالكاميرا (طلب صريح 2026-10-11): الباركود على بطاقات القطع من نوع CODE93 ويحمل رمز الصنف (15 رقمًا).
   فكّ الباركود يتم هنا داخل هاتف المستخدم بلا أي مكتبة خارجية ولا طلب شبكة؛ لا يصل الوكيل إلا رمز الصنف نفسه مشفّرًا.
   Safari على الآيفون بلا BarcodeDetector فنفكّه بأنفسنا: خطوط مسح على عدة زوايا ← أطوال الأشرطة ← مطابقة الأنماط ← فحص C وK. */
(function(){
'use strict';
const SYMS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. $/+%abcd';  // a-d = رموز التحويل (لا ندعمها)
const BITS = ['100010100','101001000','101000100','101000010','100101000','100100100','100100010','101010000','100010010','100001010',
  '110101000','110100100','110100010','110010100','110010010','110001010','101101000','101100100','101100010','100110100',
  '100011010','101011000','101001100','101000110','100101100','100010110','110110100','110110010','110101100','110100110',
  '110010110','110011010','101101100','101100110','100110110','100111010','100101110','111010100','111010010','111001010',
  '101101110','101110110','110101110','100100110','111011010','111010110','100110010'];
const START = BITS.length;  // الفهرس 47 = نمط البداية/النهاية (*)
BITS.push('101011110');
const PATS = BITS.map(b => { const r = []; let c = b[0], n = 0; for(const x of b){ if(x === c) n++; else { r.push(n); c = x; n = 1; } } r.push(n); return r; });

function match(lens, pos){
  let t = 0; for(let k = 0; k < 6; k++) t += lens[pos + k];
  if(t < 9) return -1;
  const u = 9 / t; let best = 1e9, second = 1e9, bi = -1;
  for(let p = 0; p <= START; p++){
    const P = PATS[p]; let e = 0;
    for(let k = 0; k < 6; k++) e += Math.abs(lens[pos + k] * u - P[k]);
    if(e < best){ second = best; best = e; bi = p; } else if(e < second) second = e;
  }
  return (best / 6 <= 0.34 && second - best >= 0.45) ? bi : -1;
}
function checked(vals){
  if(vals.length < 3) return null;
  const data = vals.slice(0, -2), c = vals[vals.length - 2], k = vals[vals.length - 1];
  let s = 0; for(let j = 0; j < data.length; j++) s += data[data.length - 1 - j] * ((j % 20) + 1);
  if(s % 47 !== c) return null;
  const withC = data.concat([c]); s = 0; for(let j = 0; j < withC.length; j++) s += withC[withC.length - 1 - j] * ((j % 15) + 1);
  if(s % 47 !== k) return null;
  let out = ''; for(const v of data){ if(v >= 43) return null; out += SYMS[v]; }
  return out;
}
function decodeLens(lens, firstBar){
  for(let i = firstBar ? 0 : 1; i + 6 <= lens.length; i += 2){
    // معايرة الانحياز من حرف البداية (أشرطته 6 وحدات وفراغاته 3): الضبابية/العتبة تُسمِّن الأشرطة وتُنحِّف الفراغات بمقدار b
    let T = 0, B = 0; for(let k = 0; k < 6; k++){ T += lens[i + k]; if(k % 2 === 0) B += lens[i + k]; }
    const m = T / 9; if(m < 1) continue;
    const b = (B - 6 * m) / 3; if(Math.abs(b) > 0.45 * m) continue;
    let e = 0; for(let k = 0; k < 6; k++) e += Math.abs((lens[i + k] - (k % 2 === 0 ? b : -b)) / m - PATS[START][k]);
    if(e / 6 > 0.3) continue;
    const cl = lens.map((x, k) => k < i ? x : Math.max(0.1, x - ((k - i) % 2 === 0 ? b : -b)));
    const vals = []; let pos = i + 6, ok = false;
    while(pos + 6 <= cl.length && vals.length < 48){
      const mt = match(cl, pos); if(mt < 0) break;
      if(mt === START){ ok = pos + 6 < cl.length; break; }  // بعد النهاية شريط إنهاء بعرض وحدة
      vals.push(mt); pos += 6;

    if(!ok) continue;
    const r = checked(vals); if(r !== null) return r;
  }
  return null;
}
// خط بكسلات رمادية ← أطوال أشرطة/فراغات بدقة أقل من بكسل (حدود الانتقال تُحسب بالاستيفاء الخطي حول متوسط محلي متحرك،
// مع تخلّف ±5 لمنع وميض الضجيج). lens[k] = الفرق بين حدّين متتاليين؛ firstBar = لون أول مجرى كامل.
function lensOf(v){
  const n = v.length, pre = new Float64Array(n + 1);
  for(let i = 0; i < n; i++) pre[i + 1] = pre[i] + v[i];
  const half = Math.max(20, n >> 3), edges = []; let state = -1, firstBar = false, prevD = 0, lastDown = 0, lastUp = 0;
  for(let i = 0; i < n; i++){
    const a = Math.max(0, i - half), b = Math.min(n, i + half), d = v[i] - (pre[b] - pre[a]) / (b - a);
    if(i > 0){
      if(prevD >= 0 && d < 0) lastDown = (i - 1) + prevD / (prevD - d);
      else if(prevD < 0 && d >= 0) lastUp = (i - 1) + (-prevD) / (d - prevD);
    }
    prevD = d;
    let s = state; if(d < -5) s = 1; else if(d > 5) s = 0;
    if(s < 0 || s === state) continue;
    if(state >= 0){
      let e = s === 1 ? lastDown : lastUp;
      if(edges.length && e <= edges[edges.length - 1]) e = edges[edges.length - 1] + 0.01;
      edges.push(e);
      if(edges.length === 1) firstBar = s === 1;
    }
    state = s;
  }
  const lens = []; for(let k = 0; k + 1 < edges.length; k++) lens.push(edges[k + 1] - edges[k]);
  return {lens, firstBar};
}
// ---------- فكّ "ناعم" للصور المأخوذة من الاستوديو (طلب 2026-10-16): الصورة قد لا تكون واضحة 100% ----------
// الفكّ الصارم يرفض أي حرف غامض. هنا نحتفظ لكل حرف بأفضل 3 أنماط (وأفضل 3 أرقام) مع خطأ المطابقة، نجمع أصوات خطوط كثيرة من الصورة،
// ثم نبحث عن أرقام تُحقِّق فحصَي C وK المقروءين (أرقام فقط، ومورد معروف) — فحصان = حماية قوية من القراءة الخاطئة.
function rankAt(lens, pos){
  let t = 0; for(let k = 0; k < 6; k++) t += lens[pos + k];
  if(t < 9) return null;
  const u = 9 / t, all = [], dig = [];
  for(let p = 0; p <= START; p++){
    const P = PATS[p]; let e = 0;
    for(let k = 0; k < 6; k++) e += Math.abs(lens[pos + k] * u - P[k]);
    all.push([p, e]);
  }
  all.sort((a, b) => a[1] - b[1]);
  // الرقم لا يُرشَّح إلا إن كان بين أفضل 4 أنماط من الـ47 (لا نفرض رقمًا على حرف يشبه رمزًا آخر): هذا ما يُبقي القراءات الخاطئة نادرة جدًا
  return {all: all.slice(0, 3), dig: all.slice(0, 4).filter(x => x[0] < 10)};
}
function softParse(lens, firstBar){
  for(let i = firstBar ? 0 : 1; i + 6 <= lens.length; i += 2){
    let T = 0, B = 0; for(let k = 0; k < 6; k++){ T += lens[i + k]; if(k % 2 === 0) B += lens[i + k]; }
    const m = T / 9; if(m < 1) continue;
    const b = (B - 6 * m) / 3; if(Math.abs(b) > 0.5 * m) continue;
    let e = 0; for(let k = 0; k < 6; k++) e += Math.abs((lens[i + k] - (k % 2 === 0 ? b : -b)) / m - PATS[START][k]);
    if(e / 6 > 0.4) continue;
    const cl = lens.map((x, k) => k < i ? x : Math.max(0.1, x - ((k - i) % 2 === 0 ? b : -b)));
    const cols = []; let pos = i + 6, ok = false;
    while(pos + 6 <= cl.length && cols.length < 20){
      const r = rankAt(cl, pos); if(!r || r.all[0][1] / 6 > 0.55) break;
      if(r.all[0][0] === START){ ok = pos + 6 < cl.length; break; }
      cols.push(r); pos += 6;
    }
    if(ok && cols.length >= 14 && cols.length <= 18) return cols;
  }
  return null;
}
function ckOf(d){  // d = قيم الأرقام (0-9) ← [C, K]
  let s = 0; for(let j = 0; j < d.length; j++) s += d[d.length - 1 - j] * ((j % 20) + 1);
  const c = s % 47, w = d.concat([c]); s = 0; for(let j = 0; j < w.length; j++) s += w[w.length - 1 - j] * ((j % 15) + 1);

}
// parts = قراءات ناعمة (أعمدة لكل خط)؛ known(كود4أرقام) اختياري: يقبل أول 4 أرقام (المورد) إن كانت لمورد موجود
function softResolve(parts, known){
  const groups = {}; parts.forEach(c => { (groups[c.length] || (groups[c.length] = [])).push(c); });
  let best = null;
  Object.keys(groups).forEach(len => {
    const L = +len, n = L - 2, grp = groups[len]; if(grp.length < 2 && n < 12) return;
    const sd = [], sa = [];
    for(let j = 0; j < L; j++){ sd.push(new Float64Array(10)); sa.push(new Float64Array(48)); }
    grp.forEach(cols => cols.forEach((r, j) => {
      r.dig.forEach(([p, e]) => { sd[j][p] += Math.exp(-2.5 * e); });
      r.all.forEach(([p, e]) => { sa[j][p] += Math.exp(-2.5 * e); }); }));
    const order = (arr, k) => Array.from(arr, (v, i) => [i, v]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, k);
    const dc = [], unc = [];
    for(let j = 0; j < n; j++){
      const o = order(sd[j], 3); if(!o.length) return;
      dc.push(o); const margin = o.length > 1 ? (o[0][1] - o[1][1]) / o[0][1] : 1;
      if(margin < 0.6) unc.push([margin, j]);
    }
    const cc = order(sa[n].subarray(0, 47), 2), kc = order(sa[n + 1].subarray(0, 47), 2);
    if(!cc.length || !kc.length) return;
    unc.sort((a, b) => a[0] - b[0]);
    const U = unc.slice(0, 3).map(x => x[1]), base = dc.map(o => o[0][0]);
    for(let mask = 0; mask < (1 << U.length); mask++){
      const d = base.slice(); let score = 0, bad = false;
      for(let j = 0; j < n; j++) score += Math.log(dc[j][0][1] + 1e-9);
      U.forEach((j, bit) => { if(mask >> bit & 1){ if(dc[j].length < 2){ bad = true; return; } d[j] = dc[j][1][0]; score += Math.log((dc[j][1][1] + 1e-9) / (dc[j][0][1] + 1e-9)); } });
      if(bad) continue;
      const [c, k] = ckOf(d);
      const ci = cc.findIndex(x => x[0] === c), ki = kc.findIndex(x => x[0] === k);

const curModels = () => [...new Set([...document.querySelectorAll('#ums .mi')].flatMap(i => i.value.split(/[\s,،؛;]+/)).map(m => m.trim().toUpperCase()).filter(Boolean))];
function dupCards(sup, models){  // البطاقات الموجودة لهذه الموديلات (نفس المورد)
  if(!sup) return [];
  const all = cardsOf(D.items.concat(pending().map(p => Object.assign({_pend: true}, p))));
  return all.filter(c => c.s === sup[0] && models.includes(c.m));
}
// رصيد الموديل في الفروع أثناء الكتابة (2026-11-20): ملف مشفّر لكل مورد (آخر حركة مسجلة في الجهاز، بلا ERP)
const BALF = {};
async function supBal(sup){
  if(sup in BALF) return BALF[sup];
  const h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('alharam-invb|' + sup)))].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 14);
  try { const r = await fetch('b/' + h + '.bin'); if(!r.ok) return BALF[sup] = {};
    const u = new Uint8Array(await r.arrayBuffer());
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: u.slice(0, 12), additionalData: new TextEncoder().encode('b' + sup)}, K, u.slice(12));
    return BALF[sup] = JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  } catch(_){ return BALF[sup] = {}; }
}
let balT = 0;
function balShow(){ clearTimeout(balT); balT = setTimeout(balNow, 250); }
async function balNow(){

  if(supOf($('us').value) !== sup) return;

    const parts = B ? Object.keys(D.branches).filter(c => B[c]).map(c => D.branches[c] + ' ' + B[c][0]) : [];
    d.innerHTML = '<b></b> <span></span>'; d.children[0].textContent = m + ':';
    d.children[1].className = parts.length ? 'ok' : B ? 'no' : 'bad';
    const inf = B ? [B._d || '', B._p ? 'سعر البيع ' + fmtP(B._p) + ' ريال' : ''].filter(Boolean).join(' — ') : '';
    d.children[1].textContent = (inf ? inf + ' | ' : '') + (parts.length ? 'الرصيد: ' + parts.join(' · ') : B ? 'لا رصيد في الفروع' : '⚠️ هذا الموديل غير موجود في بياناتنا لهذا المورد — تأكد من الرقم');
    box.appendChild(d); });
}

let ADDSIG = '';

  d.appendChild(ch);

$('send').onclick = async () => {
  const br = $('ub').value, sup = supOf($('us').value), models = curModels();

  const dc = dupCards(sup, models), add = dc.length > 0;
  if(add && !($('addok') && $('addok').checked)){ msg('هذا الموديل له بطاقة: افتح الإشعار السابق وتأكد أن إشعارك جديد، ثم ضع علامة ✓ «تأكدتُ أنه إشعار جديد».', false); return; }

  {  // موديل غير موجود في بياناتنا لهذا المورد: تنبيه وتأكيد قبل الرفع (2026-11-20)

    const id = rid(), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(id + 'f')}, K, new Uint8Array(await OUT.blob.arrayBuffer())));
    const file = new Uint8Array(12 + ct.length); file.set(iv); file.set(ct, 12);
    const head = await encMsg({id, ts: Math.floor(Date.now() / 1000), k: 'iup', b: br, s: sup[0], m: models, w: OUT.w, h: OUT.h, t: OUT.type, a: add ? 1 : 0});
    const w = waitReply(id, 180000);
    await new Promise(r => setTimeout(r, 700));
    const r0 = await fetch(D.base + '/' + D.topic + 'q', {method: 'PUT', body: file, headers: {'Filename': 'i.bin', 'Message': head}});
    if(!r0.ok) throw new Error('send');
    btn.textContent = '⏳ بانتظار تأكيد الجهاز…';
    // نسخة مؤقتة في الجوال حتى تظهر في الصفحة المنشورة
    const th = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(OUT.blob); });
    const r = await w;
    if(r && r.ok){
      const pl = pending(); pl.push({id, at: r.at, b: br, s: sup[0], sn: sup[1], m: r.m || models, th: OUT.blob.size < 150000 ? th : ''}); setPending(pl.slice(-10));
      msg((add ? '✓ أُضيف الإشعار لنفس البطاقة.' : '✓ تم الرفع.') + ' سيظهر لكل الفروع خلال دقيقة أو دقيقتين.', true);
      resetModels(); $('mdup').textContent = ''; ADDSIG = ''; $('uf').value = ''; $('pvw').hidden = true; OUT = null; SRC = null;
    } else msg(r ? 'تعذّر: ' + (r.error || 'خطأ') : 'أُرسلت الصورة لكن لم يصل تأكيد من الجهاز (قد يكون مغلقًا). أعد المحاولة لاحقًا.', false);
  } catch(_){ msg('تعذّر الإرسال، تأكد من الاتصال وحاول مرة أخرى.', false); }
  btn.disabled = false; btn.textContent = 'رفع';
};
$('us').addEventListener('input', () => { const s = supOf($('us').value); $('usn').textContent = s ? '✓ ' + supLabel(s) : ''; });

// مسح باركود الستيكر (2026-11-21): نفس قارئ صفحة الاستعلام، والتحويل رمز الصنف ← الموديل من ملف المورد المحفوظ (بلا ERP)
function setupScans(){
  if(!window.setupScan) return;
  if(EMB){  // داخل رابط المسؤول: نافذة الكاميرا (#scanov) تملأ شاشة الجوال كاملة أثناء المسح فقط
    let on = false;
    new MutationObserver(() => { const now = !!document.getElementById('scanov'); if(now === on) return; on = now;
      try { window.parent.postMessage({invFull: now}, '*'); } catch(_){} }).observe(document.body, {childList: true}); }
  const hid = document.createElement('button'); hid.id = 'iask'; hid.type = 'button'; hid.hidden = true; document.body.appendChild(hid);
  const mk = (anchor, onCode) => {

    a.id = anchor; e.id = '';  // تحرير المعرّفات للاستدعاء التالي
  };

async function scanFill(code, up, e){
  e.textContent = ''; e.style.color = '';  // الأحمر للتحذير فقط؛ النجاح أخضر والمعلومة رمادية (2026-11-21)
  const c4 = code.slice(0, 4), sup = D.sups.find(s => s[0] === c4);

    const cur = supOf($('us').value);

      e.textContent = '⚠️ هذا الستيكر لمورد آخر (' + supLabel(sup) + ')، والإشعار الحالي للمورد ' + cur[0] + '. امسح ستيكر نفس المورد.'; return; }

    else if(model){  // السطر الفارغ الذي ضُغط عليه أخيرًا، وإلا أول سطر فارغ، وإلا سطر جديد (2026-11-21)

      inp.style.outline = '2px solid var(--ok)'; setTimeout(() => { inp.style.outline = ''; }, 2500); }

}
let LASTMI = null;
