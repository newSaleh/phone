<!doctype html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>طلبيات الموردين</title>
<script>(function(){var d=document.documentElement,g=function(k){try{var v=localStorage.getItem(k);return v==null?null:JSON.parse(v)}catch(e){return null}};var th=g("theme")||(matchMedia("(prefers-color-scheme:light)").matches?"day":"night"),l=g("lang")||"ar";d.dataset.theme=th;d.lang=l;d.dir=l==="en"?"ltr":"rtl";var m=document.querySelector("meta[name=theme-color]");if(m)m.content=th==="night"?"#16202e":"#1d3557"})()</script>
<style>
:root,[data-theme=day]{--bg:#f2f5f9;--card:#fff;--ink:#17202b;--mut:#66758a;--pri:#1d3557;--pri2:#2a4d7e;--ok:#1f8a4c;--okbg:#e4f5ea;--warn:#b7791f;--warnbg:#fff4d9;--bad:#c0392b;--badbg:#fdeae7;--line:#dde3ec;--blue:#e7eef9}
[data-theme=night]{color-scheme:dark;--bg:#10151c;--card:#1a212b;--ink:#e8edf3;--mut:#93a0b2;--pri:#6ea2e8;--pri2:#8ab6f0;--ok:#4cc38a;--okbg:#14301f;--warn:#e0a84a;--warnbg:#3a2f14;--bad:#ff7b6b;--badbg:#3a1b17;--line:#2c3644;--blue:#1d2a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
header.top{background:var(--pri);color:#fff;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
[data-theme=night] header.top{background:#16202e}
header.top h1{margin:0;font-size:19px;flex:1;text-align:center;font-weight:700}
header.top button{background:rgba(255,255,255,.14);color:#fff;border:0;min-height:44px;min-width:44px;font-size:17px;border-radius:12px;padding:0 10px}
header.top h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top h1 small{display:block;font-size:13px;font-weight:400;opacity:.8;line-height:1.2}
main{max-width:760px;margin:0 auto;padding:14px 12px 130px}
button{font:inherit;cursor:pointer;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;min-height:48px}
button:active{transform:scale(.98)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
[data-theme=night] button.pri,[data-theme=night] button.ok{color:#0c1118}
button.danger{color:var(--bad)}
button.big{min-height:60px;font-size:19px;width:100%;border-radius:16px}
button.sm{min-height:38px;padding:4px 12px;font-size:15px;border-radius:10px}
button:disabled{opacity:.45}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:50px}
input:focus,textarea:focus{outline:3px solid var(--pri2);outline-offset:-1px}
h2{margin:0 0 10px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:15px}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.steps i{width:34px;height:7px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--pri2)}
.q{font-size:24px;font-weight:700;text-align:center;margin:6px 0 14px}
/* الصفحة الرئيسية */
.tiles{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.tile{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;min-height:112px;padding:14px 18px;border-radius:22px;font-size:23px;text-align:start}
.tile .ic{grid-row:1/3;font-size:50px;line-height:1;text-align:center}.tile b{align-self:end}.tile small{align-self:start;font-size:15px;font-weight:400;opacity:.85}
.tile.third{background:var(--card)}.tile.third small{color:var(--mut);opacity:1}
@media (min-width:700px){.tiles{grid-template-columns:1fr 1fr 1fr}.tile{grid-template-columns:1fr;grid-template-rows:auto;justify-items:center;text-align:center;min-height:150px}.tile .ic{grid-row:auto}.tile b,.tile small{align-self:auto}}
.tile.pri small,.tile.ok small{opacity:.9}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;justify-content:space-between;min-height:68px;font-size:22px;font-weight:700;padding:10px 18px;text-align:start;border-radius:18px}
.choice small{font-weight:400;font-size:15px;color:var(--mut)}
.choice.on{background:var(--pri);color:#fff;border-color:var(--pri)}.choice.on small{color:#cfe0f5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border-radius:999px;min-height:42px;padding:6px 14px;font-size:16px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
[data-theme=night] .chip.on{color:#0c1118}
.oc{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.oc .t{font-size:19px;font-weight:700}.oc .m{color:var(--mut);font-size:15px;margin-top:2px}
.badge{display:inline-block;font-size:14px;font-weight:700;border-radius:999px;padding:3px 12px;margin-top:6px}
.badge.pending{background:var(--blue);color:var(--pri2)}.badge.done{background:var(--okbg);color:var(--ok)}.badge.diff{background:var(--warnbg);color:var(--warn)}
.empty{color:var(--mut);padding:22px 8px;text-align:center}
/* الموردون */
.sup{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;min-height:56px;margin-bottom:8px;border-radius:14px;font-size:18px}
.sup b{font-family:Consolas,monospace;color:var(--mut);font-weight:400;direction:ltr}
.lockbox{background:var(--warnbg);border-radius:14px;padding:12px;margin-bottom:12px}
/* الملخص والأزرار */
.sum{display:grid;gap:8px}
.sum .r{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg);border-radius:12px;padding:8px 12px}
.sum .r span{color:var(--mut);font-size:14px;min-width:48px}.sum .r b{flex:1;font-size:18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .full{grid-column:1/-1}
.acts button{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;border-radius:18px}
.acts button .ic{font-size:30px;line-height:1}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:18px;font-weight:700}
.banner.ok{background:var(--okbg);color:var(--ok)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.info{background:var(--blue);color:var(--pri2)}
/* السطور */
.ln{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:34px 1fr 96px 44px;gap:8px;align-items:center}
.ln .nn{grid-row:1/3;color:var(--mut);text-align:center;font-weight:700;align-self:center}
.ln .cr{grid-column:2/5}.ln .cr img{display:block;max-width:100%;max-height:66px;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:zoom-in}
.ln .cr .none{color:var(--mut);font-size:14px}
.ln.low{border-color:var(--warn);background:var(--warnbg)}.ln.dup{border-color:var(--bad)}
.ln .tags{grid-column:2/5}
.ln .nt{grid-column:2/5}
input.model{direction:ltr;text-align:left;font-family:Consolas,'Courier New',monospace;font-size:23px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;min-height:54px}
input.qty{text-align:center;font-size:20px;font-weight:700}
.ln .x{padding:0;min-height:48px;font-size:20px}
.tag{display:inline-block;font-size:14px;border-radius:8px;padding:1px 9px;margin-inline-end:6px;font-weight:700}
.tag.low{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}.tag.dup{color:var(--bad);border:1px solid var(--bad)}
.tag.fix{background:var(--okbg);color:var(--ok)}
.addrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.addrow button{min-height:60px;font-size:16px;line-height:1.2;padding:6px}
@media (min-width:700px){.ln{grid-template-columns:34px 1.2fr 1.3fr 96px 44px}.ln .nn{grid-row:auto}.ln .cr{grid-column:auto}.ln .tags{grid-column:2/6}}
.dock{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px;justify-content:center}
.dock>*{max-width:740px}.dock button{flex:1}
/* نتيجة المطابقة */
.sec{border-radius:16px;margin-bottom:12px;overflow:hidden;border:1.5px solid var(--line);background:var(--card)}
.sec>h3{margin:0;padding:10px 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sec.miss>h3{background:var(--badbg);color:var(--bad)}.sec.extra>h3{background:var(--warnbg);color:var(--warn)}.sec.qtyd>h3{background:var(--warnbg);color:var(--warn)}.sec.good>h3{background:var(--okbg);color:var(--ok)}
details.more{margin:12px 0}
details.more>summary{list-style:none;cursor:pointer;min-height:50px;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:14px;color:var(--mut);font-size:17px}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:12px}
.tile.scan{min-height:150px;font-size:26px;text-align:center}.tile.scan b{align-self:center}
details.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;font-size:18px;color:var(--ok);background:var(--okbg);min-height:52px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'▾';font-size:24px;line-height:1;transition:transform .2s}
details.sec[open]>summary::after{transform:rotate(180deg)}
.it{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.it .m{font-family:Consolas,monospace;font-size:20px;font-weight:700;direction:ltr;min-width:110px}
.it .i{flex:1;color:var(--mut);font-size:15px;min-width:90px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tabs button{min-height:54px;font-size:18px;font-weight:700}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
[data-theme=night] .tabs button.on{color:#0c1118}
/* نوافذ */
.veil{position:fixed;inset:0;background:rgba(10,15,22,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet h2{display:flex;justify-content:space-between;align-items:center}
.pv{display:grid;gap:8px;justify-items:center;margin:8px 0}
.pv canvas{max-width:100%;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#busy{position:fixed;inset:0;background:rgba(10,15,22,.78);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
#busy .b{background:var(--card);border-radius:22px;padding:24px 20px;width:100%;max-width:420px;text-align:center}
#busy .big2{font-size:22px;font-weight:700;margin-bottom:6px}
.bar2{height:12px;background:var(--line);border-radius:6px;margin:14px 0 6px;overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:25;padding:12px}
#lb img{max-width:min(900px,100%);background:#fff;border-radius:6px}
#toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 20px;border-radius:12px;display:none;z-index:40;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hint{background:var(--blue);color:var(--pri2);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:12px}
label.f{display:block;font-size:15px;color:var(--mut);margin:10px 0 4px}
</style>
</head>
<body>
<header class="top"><button id="back" hidden>→</button><h1 id="ttl">طلبيات الموردين</h1><button id="lang" aria-label="Language">🌐</button><button id="theme" aria-label="Theme">☀️</button><button id="gear" aria-label="Settings">⚙</button></header>
<main id="app"></main>
<div id="busy" hidden><div class="b"><div class="big2" id="busyMsg"></div><div class="bar2"><i id="busyBar"></i></div><div class="mut" id="busySub"></div></div></div>
<div id="lb"><img alt=""></div><div id="toast"></div>
<script src="i18n.js"></script>
<script src="vendor/ort.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="ocr.js"></script>
<script src="compare.js"></script>
<script src="pdfgen.js"></script>
<script src="app.js"></script>
</body>
</html>
