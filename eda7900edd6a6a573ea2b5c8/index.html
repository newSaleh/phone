<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#1e3a5f;--line:#e2e8f2;--dn:#b91c1c;--warn:#92400e;--warnbg:#fef3c7}
:root[data-theme=dark]{--bg:#10151d;--card:#18202c;--ink:#e5e9f0;--mut:#9aa6b8;--pri:#7fb0ff;--line:#2a3547;--dn:#f08585;--warn:#fcd34d;--warnbg:#3a2f12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:1.2rem;margin:0;color:var(--pri)}
.theme{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
label{display:block;color:var(--mut);font-size:.85rem;margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;margin-bottom:10px}.row>div{flex:1;min-width:0}
.go{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--bg);font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;margin-bottom:12px}
.rng{color:var(--mut);font-size:.82rem;margin:-4px 0 10px;line-height:1.6}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.88rem;margin-bottom:10px;line-height:1.6}
.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
pre{white-space:pre-wrap;word-wrap:break-word;margin:0;font:inherit;font-size:1rem;line-height:1.75}
.out,.out *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.err{color:var(--dn);text-align:center;padding:12px;font-size:.92rem}
[hidden]{display:none!important}

async function open_(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);

  const txt = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}

  const full = days.filter(x => !D.live || x !== D.live.date), lastFull = full[full.length - 1] || last;
  const f = $('from'), t = $('to'); f.min = t.min = first; f.max = t.max = last;
  f.value = t.value = last;  // الافتراضي: اليوم الجاري (حتى آخر تحديث) من وإلى إن وُجد، وإلا آخر يوم مسجل (طلب 2026-11-14)
  if(D.lite){  // «بطاقة مورد» (طلب 2026-11-20): من أول الشهر إلى الأمس
    const nw = new Date(), p2 = n => String(n).padStart(2, '0'), yd = addDays(nw.getFullYear() + '-' + p2(nw.getMonth() + 1) + '-' + p2(nw.getDate()), -1);
    let to = yd < last ? yd : last; if(to < first) to = last; let fr = to.slice(0, 8) + '01'; if(fr < first) fr = first;
    f.value = fr; t.value = to; }
  if(D.live){ const bt = $('today'); bt.hidden = false; bt.textContent = '⏱ اليوم حتى الآن (' + clock(D.live.taken) + ')';
    bt.onclick = () => { f.value = t.value = D.live.date; run(); }; }
  const sel = $('br'); D.branches.forEach(b => { const o = document.createElement('option'); o.value = o.textContent = b; sel.appendChild(o); });
  // المورد: «كل الموردين» افتراضيًا (أعلى TOP فقط)، أو مورد واحد (طلب 2026-11-13)؛ القائمة = من له مبيعات في الأيام المتاحة، أبجديًا
  const sp = $('sp'), seen = new Set(); Object.values(D.days).forEach(day => Object.values(day).forEach(r => r.forEach(([i]) => seen.add(i))));
  const op = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sp.appendChild(o); };
  const ALLS = [...seen].sort((x, y) => D.sups[x].localeCompare(D.sups[y], 'ar'));
  // بحث بالاسم أو الرمز (طلب 2026-11-13): يصفّي القائمة؛ تطبيع الألف/الهاء/الياء والأرقام العربية، والمسافات لا تُحتسب
  const norm = t => [...t].map(ch => { const c = ch.charCodeAt(0); return (c === 0x623 || c === 0x625 || c === 0x622) ? 'ا' : c === 0x629 ? 'ه' : c === 0x649 ? 'ي'

    let hits = q ? ALLS.filter(i => norm(D.sups[i]).includes(q)) : ALLS;
    {  // القائمة (الصفحتان) مرتبة بمبيعات الفترة والفرع المختارين من الأكثر للأقل (طلب 2026-11-15)
      let a = $('from').value, b = $('to').value; if(a > b){ const x = a; a = b; b = x; } const T = {}, br = $('br').value;
      if(a && b) for(let d = a; d <= b; d = addDays(d, 1)){ const r = D.days[d] && D.days[d][br]; if(r) r.forEach(([i, v]) => { T[i] = (T[i] || 0) + v; }); }
      hits = [...hits].sort((x, y) => (T[y] || 0) - (T[x] || 0) || D.sups[x].localeCompare(D.sups[y], 'ar'));
    }
    sp.textContent = ''; op('', D.lite ? '— اختر المورد —' : 'كل الموردين'); hits.forEach(i => op(i, D.sups[i]));
    $('sqn').textContent = !q ? '' : hits.length ? (hits.length === 1 ? 'مورد واحد مطابق' : hits.length + ' موردين مطابقين — اختر من القائمة') : 'لا يوجد مورد بهذا الاسم';
    const next = hits.some(i => String(i) === keep) ? keep : (q ? (hits.length ? String(hits[0]) : '') : keep);
    sp.value = next; if(next !== keep && !noRun) run(); };
  refill = fill;
  $('sq').addEventListener('input', () => fill());
  ['from', 'to', 'br'].forEach(id => $(id).addEventListener('change', () => fill(true))); $('sq').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); } });
  fill();
  $('rng').textContent = 'البيانات المتاحة من ' + dm(first) + ' إلى ' + dm(lastFull) + (D.live ? '، واليوم ' + dm(D.live.date) + ' حتى الساعة ' + clock(D.live.taken) + ' (آخر تحديث لليومية المباشرة)' : ' (يُضاف يوم جديد كل ليلة)');
  $('go').onclick = run; sp.onchange = run; $('ct').onchange = run; run();
}
let refill = null, catSup = null;
// الأصناف (طلب 2026-11-20): قائمة أصناف المورد المختار، مرتبة بمبيعاتها؛ «كل الأصناف» = النتيجة المعتادة
function fillCats(one){
  const row = $('ctrow'), ct = $('ct');
  if(!D.cat || one === ''){ row.hidden = true; ct.value = ''; catSup = one; return; }
  if(catSup === one) return; catSup = one;
  const oi = +one, T = {};
  Object.values(D.cat.br).forEach(B => B.f.forEach(f => f.forEach(([i, c, v]) => { if(i === oi) T[c] = (T[c] || 0) + v; })));
  if(D.dl) Object.entries(D.dl).forEach(([k, day]) => { if(k[0] !== '_') Object.values(day).forEach(r => r.forEach(([i, , cs]) => { if(i === oi && cs) cs.forEach(([c]) => { if(!(c in T)) T[c] = 0; }); })); });
  ct.textContent = ''; const o0 = document.createElement('option'); o0.value = ''; o0.textContent = 'كل الأصناف'; ct.appendChild(o0);
  Object.keys(T).map(Number).sort((x, y) => T[y] - T[x] || D.cat.names[x].localeCompare(D.cat.names[y], 'ar')).forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = D.cat.names[c]; ct.appendChild(o); });
  ct.value = ''; row.hidden = false;
}
// مبيعات صنف المورد في فرع ويوم = مبيعات المورد في اليومية × نسبة الصنف من حركة البيع في الفحص اليومي لذلك اليوم
function catSales(a, b, oi, c, brs){
  const pb = {}, nod = new Set(); brs.forEach(x => pb[x] = 0);
  for(let d = a; d <= b; d = addDays(d, 1)) brs.forEach(x => {
    const r = D.days[d] && D.days[d][x]; if(!r) return;
    const T = r.reduce((t, [i, v]) => i === oi ? t + v : t, 0); if(!T) return;
    const B = D.cat.br[x], fi = B ? B.d[d] : undefined;
    if(fi === undefined){ nod.add(d); return; }
    let s = 0, sc = 0; B.f[fi].forEach(([i, cc, v]) => { if(i === oi){ s += v; if(cc === c) sc += v; } });
    if(s > 0) pb[x] += T * sc / s;
  });
  return {pb, nod: [...nod].sort()};
}
function run(){
  if(refill) refill(true);  // ترتيب القائمة يتبع الفترة والفرع

  if(!a || !b){ $('err').textContent = 'اختر التاريخين'; return; }
  if(a > b){ const x = a; a = b; b = x; $('from').value = a; $('to').value = b; }
  const tot = {}, miss = []; let n = 0;
  for(let d = a; d <= b; d = addDays(d, 1)){
    const day = D.days[d] && D.days[d][br];
    if(!day){ miss.push(d); continue; }
    n++; day.forEach(([i, v]) => { tot[i] = (tot[i] || 0) + v; });
  }
  const rows = Object.entries(tot).filter(([, v]) => v !== 0).sort((x, y) => y[1] - x[1]);

  if(miss.length){ w.hidden = false; w.textContent = '⚠️ لا توجد بيانات محفوظة لـ' + (miss.length === 1 ? 'يوم واحد' : miss.length === 2 ? 'يومين' : ' ' + miss.length + (miss.length <= 10 ? ' أيام' : ' يومًا')) + ' في هذه الفترة ولم ' + (miss.length === 1 ? 'يُحسب' : 'تُحسب') + ': ' + (miss.length > 12 ? miss.slice(0, 12).map(dm).join('، ') + ' …' : miss.map(dm).join('، ')); }
  else w.hidden = true;
  if(!n){ $('out').hidden = true; $('err').textContent = 'لا توجد بيانات لهذه الفترة'; return; }
  let per = a === b ? 'يوم ' + dm(a) : 'من ' + dm(a) + ' إلى ' + dm(b); const one = $('sp').value, L = [];
  if(D.live && a <= D.live.date && D.live.date <= b && D.days[D.live.date] && D.days[D.live.date][br]) per += (a === b ? ' — حتى الساعة ' : ' (اليوم حتى الساعة ') + clock(D.live.taken) + (a === b ? '' : ')');
  fillCats(one); const cat = D.cat && one !== '' && $('ct').value !== '' ? +$('ct').value : null, cn = cat === null ? '' : D.cat.names[cat];
  if(one === '' && D.lite){ $('out').hidden = true; $('err').textContent = 'اختر المورد من القائمة أو ابحث باسمه أو رقمه'; return; }
  if(one === ''){  // كل الموردين + الإجمالي
    L.push('مبيعات الموردين (' + br + ')', per, '_________________________');
    if(br === D.branches[0]){  // إجمالي كل فرع أعلى الصفحة مثل رسالة اليومية (طلب 2026-11-15)
      const bt = {}; D.branches.slice(1).forEach(x => bt[x] = 0);
      for(let d = a; d <= b; d = addDays(d, 1)) D.branches.slice(1).forEach(x => { const r = D.days[d] && D.days[d][x]; if(r) r.forEach(([, v]) => bt[x] += v); });
      D.branches.slice(1).sort((x, y) => bt[y] - bt[x]).forEach(x => L.push(x + ': ' + fmt(bt[x])));  // من الأكثر للأقل (2026-11-15)
      L.push('', 'الإجمالي: ' + fmt(rows.reduce((t, [, v]) => t + v, 0)), '_________________________');
    } else L.push(br + ': ' + fmt(rows.reduce((t, [, v]) => t + v, 0)), '_________________________');  // فرع واحد: مجموع مبيعاته أعلى الصفحة (2026-11-15)
    L.push('عدد الموردين ' + rows.length, '_________________________');
    rows.forEach(([i, v], k) => L.push((k + 1) + '. ' + D.sups[i] + ' — ' + fmt(v)));
    L.push('', 'الإجمالي: ' + fmt(rows.reduce((t, [, v]) => t + v, 0)));
  } else {  // مورد واحد: مجموعه في الفترة وترتيبه، ومع «كل الفروع» توزيعه على الفروع
    const k = rows.findIndex(([i]) => i === one);
    L.push('مبيعات المورد ' + D.sups[+one] + (cat !== null ? ' — صنف: ' + cn : '') + ' (' + br + ')', per, '_________________________');
    if(k < 0){ L.push('لا توجد مبيعات لهذا المورد في هذه الفترة'); }
    else if(cat !== null){  // صنف واحد
      const brs = br === D.branches[0] ? D.branches.slice(1) : [br], cs = catSales(a, b, +one, cat, brs), ct = brs.reduce((t, x) => t + cs.pb[x], 0);
      L.push('مبيعات الصنف: ' + fmt(ct), 'من مبيعات المورد ' + fmt(rows[k][1]) + (rows[k][1] > 0 ? ' (' + Math.round(ct * 100 / rows[k][1]) + '%)' : ''));
      if(brs.length > 1){ L.push('', 'حسب الفرع:'); brs.filter(x => Math.round(cs.pb[x])).sort((x, y) => cs.pb[y] - cs.pb[x]).forEach(x => L.push(x + ' — ' + fmt(cs.pb[x]))); }
      L.push('(مبيعات المورد في اليومية موزعة على أصنافه بنسبة حركة البيع)');
      if(cs.nod.length) L.push('(بلا تفصيل أصناف بعد، فلم يُحسب للصنف: ' + cs.nod.map(dm).join('، ') + ')');
    }
    else {
      L.push('المبيعات: ' + fmt(rows[k][1]), 'ترتيبه: ' + (k + 1) + ' من ' + rows.length + ' موردًا');
      if(br === D.branches[0]){
        const pb = {}; D.branches.slice(1).forEach(x => pb[x] = 0);
        for(let d = a; d <= b; d = addDays(d, 1)) D.branches.slice(1).forEach(x => { const r = D.days[d] && D.days[d][x]; if(r) r.forEach(([i, v]) => { if(i === +one) pb[x] += v; }); });
        L.push('', 'حسب الفرع:'); Object.entries(pb).filter(([, v]) => v !== 0).sort((x, y) => y[1] - x[1]).forEach(([x, v]) => L.push(x + ' — ' + fmt(v)));
      }
    }
    if(D.dl){  // مبلغ التنزيل = التنزيل − المرتجع للمستودع، لنفس الفترة، الفروع من الأكثر للأقل (طلب 2026-11-20)
      const LV = D.dl._live || {}, pb = {}, brs = br === D.branches[0] ? D.branches.slice(1) : [br], dd = Object.keys(D.dl).filter(x => x[0] !== '_').sort(); let have = 0, dmiss = 0, inToday = false;
      brs.forEach(x => pb[x] = 0);
      for(let d = a; d <= b; d = addDays(d, 1)){ const day = D.dl[d]; if(!day){ dmiss++; continue; } have++; if(D.live && d === D.live.date) inToday = true;
        brs.forEach(x => { const r = day[x]; if(r) r.forEach(([i, v, cs]) => { if(i !== +one) return; if(cat === null) pb[x] += v; else if(cs) cs.forEach(([c, w]) => { if(c === cat) pb[x] += w; }); }); }); }
      L.push('', '_________________________', 'مبلغ التنزيل (التنزيل − المرتجع) بسعر البيع' + (cat !== null ? ' — صنف: ' + cn : '') + ':');
      if(!have) L.push('لا توجد بيانات تنزيل لهذه الفترة' + (dd.length ? ' (المتاح من ' + dm(dd[0]) + ' إلى ' + dm(dd[dd.length - 1]) + ')' : ''));
      else {
        brs.slice().sort((x, y) => pb[y] - pb[x]).forEach(x => L.push(x + ' — ' + fmt(pb[x])));
        if(brs.length > 1) L.push('المجموع: ' + fmt(brs.reduce((t, x) => t + pb[x], 0)));
        if(dmiss) L.push('(محسوب حتى ' + dm(dd[dd.length - 1]) + ')');
        if(inToday){  // اليوم: حتى آخر «تحديث» لمتابعة التنزيل في كل فرع

          if(off.length) L.push('(' + (brs.length > 1 ? off.join('، ') + ': ' : '') + 'لم تُحدَّث متابعة التنزيل اليوم بعد، فلا يُحسب تنزيل اليوم)');
        }
      }
    }
    if(D.stock && D.stock.locs){  // المخزون الحالي للمورد (آخر لقطة، بسعر البيع)

['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(ev => $('out').addEventListener(ev, e => e.preventDefault()));  // بلا نسخ (طلب 2026-11-12)
const SK = 'ssk:' + location.pathname;  // مفتاح لكل صفحة (النسختان على نفس النطاق)

}

const BUILD = +document.querySelector('meta[name=build]').content; let lastCheck = 0;
async function checkUpdate(){
  if(Date.now() - lastCheck < 60000) return; lastCheck = Date.now();
  try { const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    const m = (await r.text()).match(/name="build" content="([0-9]+)"/);
    if(m && +m[1] > BUILD) location.replace(location.pathname + '?v=' + m[1] + location.hash); } catch(_){}
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(); });
checkUpdate();
