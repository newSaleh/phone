<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#1e3a5f;--line:#e2e8f2;--dn:#b91c1c;--warn:#92400e;--warnbg:#fef3c7}
:root[data-theme=dark]{--bg:#10151d;--card:#18202c;--ink:#e5e9f0;--mut:#9aa6b8;--pri:#7fb0ff;--line:#2a3547;--dn:#f08585;--warn:#fcd34d;--warnbg:#3a2f12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:1.2rem;margin:0;color:var(--pri)}
.theme{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
label{display:block;color:var(--mut);font-size:.85rem;margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;margin-bottom:10px}.row>div{flex:1;min-width:0}
.go{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--bg);font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;margin-bottom:12px}
.rng{color:var(--mut);font-size:.82rem;margin:-4px 0 10px;line-height:1.6}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.88rem;margin-bottom:10px;line-height:1.6}
.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
pre{white-space:pre-wrap;word-wrap:break-word;margin:0;font:inherit;font-size:1rem;line-height:1.75}
.out,.out *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.err{color:var(--dn);text-align:center;padding:12px;font-size:.92rem}
[hidden]{display:none!important}

    const m = (await r.text()).match(/name="build" content="([0-9]+)"/);
    if(m && +m[1] > BUILD) location.replace(location.pathname + '?v=' + m[1] + location.hash); } catch(_){}
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(); });
checkUpdate();
</script></body></html>
